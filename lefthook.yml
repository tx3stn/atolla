# https://lefthook.dev/configuration/
assert_lefthook_installed: true
pre-push:
  parallel: true
  fail_on_changes: always
  fail_on_changes_diff: true
  commands:
    check:zig:
      run: bun run check:zig

    compile:
      run: bun run compile

    lint:
      run: bun run format && bun run lint

    format:zig:
      run: bun run format:zig

    test:
      run: bun run test

    test:android:
      run: bun run test:android

    test:components:
      run: bun run test:components

    test:ios:
      run: bun run test:ios

    test:zig:
      run: bun run test:zig
