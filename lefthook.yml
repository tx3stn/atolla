# https://lefthook.dev/configuration/
assert_lefthook_installed: true
pre-push:
  parallel: true
  fail_on_changes: always
  fail_on_changes_diff: true
  jobs:
    - name: static
      group:
        parallel: true
        jobs:
          - name: lint
            run: bun run format && bun run lint
          - name: format:zig
            run: bun run format:zig
          - name: test
            run: bun run test
          - name: test:cli
            run: bun run test:e2e:cli
    - name: bazel
      group:
        jobs:
          - name: compile
            run: bun run compile
          - name: check:zig
            run: bun run check:zig
          - name: test:components
            run: bun run test:components
          - name: test:ios
            run: bun run test:ios
          - name: test:android
            run: bun run test:android
    - name: openapi
      group:
        parallel: true
        jobs:
          - name: lint
            glob: "atolla_sync/openapi.yaml"
            run: bun run openapi:lint
          - name: generate
            glob: "atolla_sync/openapi.yaml"
            run: bun run openapi:generate
    - name: zig
      group:
        parallel: true
        jobs:
          - name: test:zig:app
            run: bun run test:zig app
          - name: test:zig:cli:audio_player
            run: bun run test:zig cli:audio_player
          - name: test:zig:cli:audio_stream
            run: bun run test:zig cli:audio_stream
          - name: test:zig:cli:gst
            run: bun run test:zig cli:gst
          - name: test:zig:cli:server
            run: bun run test:zig cli:server
          - name: test:zig:cli:control
            run: bun run test:zig cli:control
          - name: test:zig:cli:media
            run: bun run test:zig cli:media
          - name: test:zig:cli:network
            run: bun run test:zig cli:network
