name: Build

# The release build definition, shared so main pushes and tag builds produce
# byte-identical bazel action keys. Without that the main-push builds warm a
# different cache than the release consumes and the release stays cold.
on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Upload the built apk/ipa as workflow artifacts.
        type: boolean
        default: false
      version-artifact:
        description: >-
          Name of an artifact holding the stamped version files to unpack before
          building. Empty (the default) builds the version already in the tree.
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: get version files
        if: inputs.version-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.version-artifact }}
          path: .
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # res/*.png is gitignored, so the icons don't exist in a fresh checkout and
      # this has to run before bazel reads res/.
      - run: bun run icons:generate --android
      - uses: ./.github/actions/install-libtinfo5
      - name: Make room for the bazel build
        run: |
          # The full APK build (Skia/ICU/harfbuzz/abseil/Valdi + host tools) overflows the
          # ~20 GB free on /. Move bazel's output base — the extracted external repos and
          # bazel-out, the dominant consumer — to the larger /mnt ephemeral disk, and reclaim
          # space from preinstalled toolchains we don't use so the repo-cache tar has room on /.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force || true
          sudo mkdir -p /mnt/bazel-ob
          sudo chown "$USER:$USER" /mnt/bazel-ob
          echo "startup --output_base=/mnt/bazel-ob" >> ~/.bazelrc
          df -h / /mnt
      # the remote cache is CI's only cache: version bumps touch a few files, so
      # most compile actions hit artifacts uploaded by the previous release
      - name: configure bazel caching
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          {
            # build:apk passes --config=android, whose .bazelrc lines re-point
            # --disk_cache to ~/.cache/bazel-disk-android; override at the same config
            # scope (home rc wins) so writing every output twice doesn't fill the disk.
            echo "build:android --disk_cache="
            # MergeAndroidAssets fails in CI but not locally because the remote cache serves
            # ValdiCompile's per-module asset tree artifacts with their nested
            # _configs/*.tsconfig.json files DROPPED (a tree-artifact cache round-trip bug). The
            # module symbols (assets.bin) still list those assets, so the merge sees a duplicate-
            # asset conflict across modules, tries to content-compare the now-absent files, and
            # dies with a NoSuchFileException that the rules_android busybox masks as the opaque
            # "Error during merging". A local build emits the complete dirs — proven in an amd64
            # container: forcing local execution restored the missing _configs files and the merge
            # returned 0. So force ValdiCompile to run locally and never be served from the remote
            # cache. Every other action still hits the cache; only the ~dozen valdi module compiles
            # re-run per release. (This replaces an earlier --remote_download_all attempt that
            # couldn't help: the artifacts are cached incomplete regardless of download mode.)
            echo "build:android --modify_execution_info=ValdiCompile=+no-remote-cache"
            # remote-cache-hit downloads are gated by --jobs, not cores
            echo "build --jobs=32"
            if [ -n "$BUILDBUDDY_API_KEY" ]; then
              echo "build --config=remote-cache"
              echo "build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
            fi
          } >> ~/.bazelrc
      # Restore-only: read the shared repository cache that CI's android-tests job
      # banks on main (default-branch caches are readable from tag runs). This tag
      # build can't usefully SAVE — a tag-scoped cache isn't visible to main runs —
      # and app-only maven deps not in the test set just partial-hit and re-fetch.
      - name: restore bazel repository cache
        id: restore-bazel-repo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'patches/**') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-
      - name: build apk
        run: JAVA_HOME="$JAVA_HOME_17_X64" bun run build:apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.upload-artifacts
        with:
          name: android-apk
          path: build/atolla_android.apk
          if-no-files-found: error

  # Every headless build runs the same suite: the platform differences this catches only show up in
  # the binary, and arm64 is where both known ones behaved differently from amd64.
  e2e-cli:
    needs:
      - headless-linux-amd64
      - headless-linux-arm64
    if: ${{ !inputs.upload-artifacts }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: headless-linux-amd64
            binary: atolla
            runner: ubuntu-latest
          - artifact: headless-linux-arm64
            binary: atolla_arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: build
      - run: chmod +x build/${{ matrix.binary }}
      - run: bun run test:e2e:cli
        env:
          ATOLLA_CLI: ${{ github.workspace }}/build/${{ matrix.binary }}

  # The headless player for an x86 box — a mini-PC, NAS or HTPC. Native, so it needs nothing beyond
  # what every other linux bazel job here needs.
  headless-linux-amd64:
    if: ${{ !inputs.upload-artifacts }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/install-libtinfo5
      - name: configure bazel caching
        uses: ./.github/actions/configure-bazel-caching
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: ./.github/actions/wait-for-disk-cleanup
      - run: bun run build:headless
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-linux-amd64
          path: build/atolla
          if-no-files-found: error

  # The headless player for a Pi. Cross-built from an amd64 runner, not natively: Valdi's prebuilt
  # valdi_compiler and pngquant select on darwin / linux_x86_64 with no arm64 build, so a native
  # arm64 build cannot finish analysis, while a cross build keeps them in the exec configuration.
  # The only extra it needs over the amd64 job is the arm64 sysroot.
  headless-linux-arm64:
    if: ${{ !inputs.upload-artifacts }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/install-libtinfo5
      # Pinned to jammy packages, so the binary's glibc and libc++ floor does not move with
      # whatever suite the runner happens to be. See the script.
      - name: build arm64 sysroot
        run: sudo ./.scripts/make-arm64-sysroot.sh /opt/sysroot-arm64
      - name: configure bazel caching
        uses: ./.github/actions/configure-bazel-caching
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: ./.github/actions/wait-for-disk-cleanup
      - run: bun run build:headless:arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-linux-arm64
          path: build/atolla_arm64
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: apply version files
        if: inputs.version-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.version-artifact }}
          path: .
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The generated icons and the liquid-glass svg copy are gitignored, so they
      # don't exist in a fresh checkout and this has to run before bazel reads assets.
      - run: bun run icons:generate --ios
      # the remote cache is CI's only cross-run cache: version bumps touch a few files,
      # so most compile actions hit artifacts uploaded by the previous release
      - name: configure bazel caching
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          {
            # build:ipa passes --config=ios, whose .bazelrc lines re-point --disk_cache
            # to ~/.cache/bazel-disk-ios; override at the same config scope (home rc wins)
            # so writing every output twice doesn't fill the disk.
            echo "build:ios --disk_cache="
            # remote-cache-hit downloads are gated by --jobs, not cores
            echo "build --jobs=32"
            if [ -n "$BUILDBUDDY_API_KEY" ]; then
              echo "build --config=remote-cache"
              echo "build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
            fi
          } >> ~/.bazelrc
      # Restore-only: read the shared repository cache that CI's ios-tests job banks on
      # main (default-branch caches are readable from tag runs). This tag build can't
      # usefully SAVE — a tag-scoped cache isn't visible to main runs — and app-only
      # deps not in the test set just partial-hit and re-fetch.
      - name: restore bazel repository cache
        id: restore-bazel-repo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'patches/**') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-
      # Device build, ad hoc signed — see .scripts/build-ios-ipa.sh. No Apple account
      # or signing secrets involved; the installing user's sideloader re-signs.
      - name: build ipa
        run: IOS_CPUS=arm64 bun run build:ipa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.upload-artifacts
        with:
          name: ios-ipa
          path: build/atolla_ios.ipa
          if-no-files-found: error
