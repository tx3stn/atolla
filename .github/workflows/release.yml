name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  set-version:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tx3stn/vrsn@e5ff48117222d97f5f1b2624b56d71f1f827b1d6 # 2.0.3
        with:
          command: set
          args: ${{ github.ref_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-files
          path: |
            atolla_core/src/version.ts
            BUILD.bazel
            atolla_app/native/android/AndroidManifest.prod.xml
          if-no-files-found: error
      - uses: tx3stn/vrsn@e5ff48117222d97f5f1b2624b56d71f1f827b1d6 # 2.0.3
        with:
          command: get
          args: --git-tag=false

  build:
    needs: set-version
    uses: ./.github/workflows/build.yml
    with:
      upload-artifacts: true
      version-artifact: version-files
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Full history + tags so git-cliff can diff this tag against the previous
      # release. Must run before download-artifact: checkout cleans the workspace
      # by default and would otherwise wipe the downloaded artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: artifacts
      # Re-sign the bazel-built APK (debug-signed by default) with the private release
      # key so published builds have a stable, verifiable identity and a working
      # in-place upgrade path. Signing happens here, in the minimal publish job, so the
      # keystore secret never enters the heavy build-android runner or bazel's action
      # cache. The keystore lives only as a base64 CI secret, is decoded to a temp file
      # for this step, and is removed on exit; the job fails closed if the secret is
      # absent rather than shipping a debug-signed release.
      - name: sign apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 secret is not set — refusing to publish a debug-signed release." >&2
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          bt="$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $bt"
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          "$bt/zipalign" -p -f 4 artifacts/atolla_android.apk artifacts/atolla_android_aligned.apk
          "$bt/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out artifacts/atolla_android.apk \
            artifacts/atolla_android_aligned.apk
          rm -f artifacts/atolla_android_aligned.apk
          "$bt/apksigner" verify --verbose --print-certs artifacts/atolla_android.apk
      # Build the notes from the conventional commits since the previous tag,
      # grouped into Features/Fixes/Other (see cliff.toml). --generate-notes only
      # lists merged PRs, so it produced empty bodies for our direct-to-main pushes.
      - name: generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
      # Renaming happens before the attestation so the subject names recorded in the
      # provenance are the published asset names, and after the signing step so the
      # attested digest is the one users download — apksigner rewrites the APK.
      - name: name release artifacts
        run: |
          mv artifacts/atolla_android.apk "atolla-$GITHUB_REF_NAME.apk"
          mv artifacts/atolla_ios.ipa "atolla-$GITHUB_REF_NAME.ipa"
      # The APK's own signature is embedded in the archive, which nothing outside an
      # Android installer can check; this publishes a detached SLSA provenance bundle
      # covering both artifacts, verifiable with `gh attestation verify --bundle`.
      - name: attest build provenance
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            atolla-${{ github.ref_name }}.apk
            atolla-${{ github.ref_name }}.ipa
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "atolla-$GITHUB_REF_NAME.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" \
            "atolla-$GITHUB_REF_NAME.apk" \
            "atolla-$GITHUB_REF_NAME.ipa" \
            "atolla-$GITHUB_REF_NAME.intoto.jsonl" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
