name: CLI end to end
description: >-
  Run the CLI suite against a headless binary downloaded from a build artifact.
  Parameterised by architecture so each headless build can run it as soon as
  that build finishes, rather than waiting for the others.
inputs:
  artifact:
    description: Name of the artifact holding the built binary.
    required: true
  binary:
    description: File name of the binary inside that artifact.
    required: true
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - run: bun install --frozen-lockfile
      shell: bash
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: build
    # artifact archives do not carry the executable bit
    - run: chmod +x build/${{ inputs.binary }}
      shell: bash
    - run: bun run test:e2e:cli
      shell: bash
      env:
        ATOLLA_CLI: ${{ github.workspace }}/build/${{ inputs.binary }}
