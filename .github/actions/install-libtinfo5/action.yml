name: Install libtinfo5
description: >-
  Valdi's hermetic llvm_toolchain clang links libtinfo.so.5, which is gone from
  ubuntu 24.04. Ubuntu's archive pool keeps only the newest point release of a
  package, so a hardcoded filename 404s the moment a security update lands.
  Discover the current filename from the pool instead so this self-heals across 
  future point releases. amd64 and arm64 are served from different hosts — arm64 
  lives on ports.ubuntu.com, not security.ubuntu.com.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        arch=$(dpkg --print-architecture)
        case "$arch" in
          amd64) base=http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses ;;
          arm64) base=http://ports.ubuntu.com/ubuntu-ports/pool/universe/n/ncurses ;;
          *) echo "unsupported architecture $arch" >&2; exit 1 ;;
        esac

        deb=$(curl -fsSL --retry 3 --retry-delay 2 "$base/" \
          | grep -oE "libtinfo5_[^\"<> ]*_${arch}\.deb" | sort -uV | tail -n1)

        if [ -z "$deb" ]; then
          echo "no libtinfo5 $arch package found in $base" >&2
          exit 1
        fi

        echo "installing $deb"
        curl -fsSL --retry 3 --retry-delay 2 -O "$base/$deb"
        sudo dpkg -i "$deb"
