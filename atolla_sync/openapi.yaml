openapi: 3.1.0
x-lint-ignore:
  - owasp-rate-limit
  - owasp-no-additionalProperties
  - owasp-constrained-additionalProperties

info:
  title: atolla control API
  version: '1'
  summary: The HTTP surface a controller uses to pair with and drive a headless atolla player.
  contact:
    email: no@email.com
    name: atolla
    url: https://github.com/tx3stn/atolla
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: |
    One daemon runs on each device with a speaker attached, listening on port 45889 by default.
    This document describes what the daemon answers today.

    `http_server.zig` refuses whatever it can without crossing into TypeScript: framing,
    per-connection limits, method and path matching, the version header, the pairing code, and
    the shape of a body. A request that passes all of those crosses the bridge once, and
    `Server.ts` picks the route.

    ### Answers that precede route selection

    Four refusals happen before an operation is chosen, so they're listed under
    `components.responses` instead of on an operation:

    | Response | Cause |
    |---|---|
    | `NotFound` | a path not in the router's table |
    | `MethodNotAllowed` | a path in the table reached with another method |
    | `HeadersTooLarge` | a request head over 8 KiB |
    | `Busy` | the connection cap (32) was already reached, so no request was read |

servers:
  - url: http://{host}:{port}
    description: A player on the local network.
    variables:
      host:
        default: 127.0.0.1
        description: The address the daemon is bound to.
      port:
        default: '45889'
        description: The control port, overridable with `atolla config --port`.
    x-lint-ignore: owasp-security-hosts-https-oas3

security:
  - controllerToken: []

tags:
  - name: control
    description: Driving playback and mirroring player state.
  - name: discovery
    description: Learning what a player is and what it speaks, before holding a credential.
  - name: media
    description: Copies of tracks the player keeps, so it can play them without the media server.
  - name: pairing
    description: |
      Trading the player's pairing code for a controller token, and giving the player the media
      server credential it acts under.

paths:
  /hello:
    get:
      operationId: getHello
      tags: [discovery]
      security: []
      x-lint-ignore:
        - owasp-define-error-responses-500
        - owasp-define-error-validation
        - owasp-protection-global-safe
      summary: Identity and the API versions this player speaks.
      description: |
        Needs no token, and it's the one route that answers whatever version it's asked for.
        Refusing it on a version mismatch would leave a controller unable to find out why it can't
        talk to the player.

        The server builds the body once at startup and serves it as is, so it keeps answering while
        the JS thread is busy. Every field stays the same for as long as the process runs. Anything
        that changes is in `/state`. The request takes no body.
      responses:
        '200':
          description: The player's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hello'
              example:
                apiVersions: [1]
                id: 4f3c9a1de8b27065
                name: Kitchen
                tier: tight
                v: 1
                version: 0.0.0
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'

  /pair:
    post:
      operationId: pair
      tags: [pairing]
      security: []
      x-lint-ignore: 
        - owasp-protection-global-unsafe-strict
        - owasp-protection-global-unsafe
      summary: Trade the player's pairing code for a controller token.
      description: |
        The server compares the code, so a wrong one never reaches TypeScript. It ignores
        whitespace, so a controller can send the code spaced the way the player prints it. A daemon
        with no code set up refuses every attempt.

        The body may carry a media server credential for the player to use. It's a Jellyfin token
        the controller mints for this player, not the user's own session token, so a compromised
        speaker costs one revocable credential.

        Bodies are capped at 4 KiB and must declare a `Content-Length`.

        Wrong codes are throttled per caller address. After three, the player holds that address
        for 1 second, answering `429` with `Retry-After`. Each further wrong code doubles the hold
        (2 seconds, then 4) up to 60. Wrong codes from every address also count together: after
        ten, with no minute-long gap between them, every caller is held the same way. A throttled
        attempt counts for nothing, so retrying early doesn't extend the hold. A successful pair
        clears the count.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        description: |
          The pairing code, who is pairing, and optionally the media server credential the player
          should use on its own behalf.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairRequest'
            examples:
              minimal:
                summary: Pair without provisioning a media server.
                value:
                  code: '19524002'
                  controllerId: phone-1
                  controllerName: pixel 8
              provisioned:
                summary: Pair and hand the player its own Jellyfin credential.
                value:
                  code: '19524002'
                  controllerId: phone-1
                  controllerName: pixel 9
                  mediaServer:
                    accessToken: 3d9f0c1b7a5e4826
                    baseUrl: http://jellyfin.local:8096
                    deviceId: atolla-4f3c9a1de8b27065-8b1f2c3d4e5f6071
                    serverId: 7e0a5b9c2d4f8613
                    userId: 8b1f2c3d4e5f6071
      responses:
        '200':
          description: Paired. The token authenticates every later request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairAccepted'
              example:
                token: 7c1e5a9b3d8f204617ca0be9352d8f7461a0c3d95e28b7f4016cad3928bf5e7d
        '400':
          $ref: '#/components/responses/PairBadRequest'
        '401':
          $ref: '#/components/responses/InvalidPairingCode'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/HandlerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/HandlerTimeout'

  /media-server:
    put:
      operationId: pushMediaServer
      tags: [pairing]
      x-lint-ignore:
        - owasp-protection-global-unsafe-strict
        - owasp-protection-global-unsafe
      summary: Give the player a media server credential to use on its own behalf.
      description: |
        The same credential `POST /pair` may carry, pushed by a controller that's already paired.
        The player keeps credentials in memory and never writes them to disk, so a restarted player
        has none until a controller pushes one again.

        A controller learns it needs to push by reading `/state`. `sourceHealth.mediaServerUsers`
        lists the accounts the player holds a credential for, and a controller that doesn't find
        its own sends one. That's also how a second person in the household gives a speaker their
        own credential without disturbing the first.

        The player holds one credential per account. Pushing again for the same `userId` replaces
        it, and pushing for a different one adds it alongside.

        Two pushes are refused instead of stored:
        - A different `serverId` from the one the player already holds would point the speaker at
          another server. That answers `409`.
        - The controller asserts the account, and nothing on the wire proves it, so the player
          asks the media server whose the token is. A token that isn't valid for the named `userId`
          answers `422`.

        A different `baseUrl` isn't refused, because each credential keeps the address its
        controller uses.

        Bodies are capped at 4 KiB and must declare a `Content-Length`.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        description: The credential the player should use for this account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaServer'
            example:
              accessToken: 3d9f0c1b7a5e4826
              baseUrl: http://jellyfin.local:8096
              deviceId: atolla-4f3c9a1de8b27065-8b1f2c3d4e5f6071
              serverId: 7e0a5b9c2d4f8613
              userId: 8b1f2c3d4e5f6071
      responses:
        '200':
          description: |
            Held. The body names the state version that reports it, so a controller can confirm
            it with `GET /state?since=` without waiting for the next change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaServerAccepted'
              example:
                version: 413
        '400':
          $ref: '#/components/responses/MediaServerBadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '409':
          $ref: '#/components/responses/MediaServerIdMismatch'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '422':
          $ref: '#/components/responses/MediaServerUserMismatch'
        '500':
          $ref: '#/components/responses/HandlerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/HandlerTimeout'

  /command:
    post:
      operationId: sendCommand
      tags: [control]
      summary: Act on the player's queue or playback.
      description: |
        Every command shares one route, told apart by `command`. The name and the shape of each
        command's members are the wire contract, so `command.zig` refuses an unknown name or a
        malformed member before the request crosses the bridge. The `tracks` array is the
        exception, and passes through unparsed. `Track` is defined once, in TypeScript, so a
        second definition in Zig would start refusing valid queues the day a field was added.

        A `202` means the player accepted the command and applied it to its queue. The body names
        the state version that reflects it. What the player then does shows only in `GET /state`:
        a `previous`, for example, can restart the current track instead of stepping back.

        Commands that name a queue position may also carry the `trackId` expected there. A
        controller works from a mirror that can be a long poll behind, and with several controllers
        paired the queue can move under it, so an index alone can point at a track the user never
        chose. When the id doesn't match, the player drops the command.

        Bodies are capped at 1 MiB and must declare a `Content-Length`.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        description: One command, named by its `command` member.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
            examples:
              pause:
                summary: Stop playing, keeping the position.
                value:
                  command: pause
              seek:
                summary: Move to 91.234 seconds into the current track.
                value:
                  command: seek
                  positionMs: 91234
              setQueue:
                summary: Replace the queue with an album and start at its third track.
                value:
                  album:
                    artistId: 1c4e7a09
                    artistName: Aphex Twin
                    id: 6f2b8c4d1e9a3705
                    name: Selected Ambient Works
                  command: setQueue
                  trackIndex: 2
                  tracks:
                    - duration: 293.4
                      id: 1a2b3c4d5e6f7081
                      name: Xtal
                    - duration: 568.1
                      id: 2b3c4d5e6f708192
                      name: Tha
                    - duration: 231.7
                      id: 3c4d5e6f708192a3
                      name: Pulsewidth
              removeAt:
                summary: Drop the fourth track, but only if it is still the one seen.
                value:
                  command: removeAt
                  trackId: 3c4d5e6f708192a3
                  trackIndex: 3
      responses:
        '202':
          description: |
            Accepted, and applied to the queue. The body names the state version that reflects it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
              example:
                version: 412
        '400':
          $ref: '#/components/responses/CommandBadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '500':
          $ref: '#/components/responses/HandlerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/HandlerTimeout'

  /state:
    get:
      operationId: getState
      tags: [control]
      summary: The player's queue, playback and group state.
      description: |
        Everything a controller mirrors, in one snapshot. A controller keeps the last one and
        replaces it whole each time. There are no partial updates: a snapshot this small is simpler
        to send whole than a diff both ends would have to agree on.

        The route is a long poll. With `since`, the daemon holds the request open for up to 25
        seconds until its version moves on, and answers as soon as it does. If nothing changes in
        that time, it answers `304` with no body, since the controller already holds that snapshot
        and resending a long queue every 25 seconds would waste the wire. Without `since`, it
        answers the current snapshot straight away, which is how a controller gets its first one.

        A controller reads a snapshot, applies it, then asks again with the `version` it applied.
        After a `304` it asks again with the same version, and after a `200` it replaces its mirror.
        Position is the one part that doesn't need a new snapshot. `positionAtMs` is for that.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: since
          in: query
          required: false
          description: |
            The version the controller holds, normally the one it last applied. The daemon
            answers as soon as its own version is different, or `304` after 25 seconds without a
            change. A `since` from before a restart is usually answered at once, because the
            counter started again from 1. It can match the new count by chance, so a controller
            that lost contact with the player should drop `since` for its next read. See
            `StateVersion`.
          schema:
            $ref: '#/components/schemas/StateVersion'
      responses:
        '200':
          description: A snapshot newer than `since`, or the current one when `since` was omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateSnapshot'
              example:
                group: default
                leader: 4f3c9a1de8b27065
                members:
                  - assigned: true
                    enabled: true
                    id: 4f3c9a1de8b27065
                    name: Kitchen
                    state: playing
                    tier: tight
                playback:
                  isPlaying: true
                  loopMode: none
                  positionAtMs: 1758000000000
                  positionMs: 91234
                queue:
                  album:
                    artistId: 1c4e7a09
                    artistName: Aphex Twin
                    id: 6f2b8c4d1e9a3705
                    name: Selected Ambient Works
                  owner: 8b1f2c3d4e5f6071
                  trackIndex: 1
                  tracks:
                    - duration: 293.4
                      id: 1a2b3c4d5e6f7081
                      name: Xtal
                    - duration: 568.1
                      id: 2b3c4d5e6f708192
                      name: Tha
                sourceHealth:
                  mediaServerUsers: [8b1f2c3d4e5f6071]
                version: 412
        '304':
          description: |
            Twenty-five seconds passed with no change since `since`. There's no body, because the
            snapshot the controller holds is still current.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '500':
          $ref: '#/components/responses/HandlerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/HandlerTimeout'

  /stream-key:
    get:
      operationId: getStreamKey
      tags: [control]
      summary: The key a member presents to join this player's audio stream.
      description: |
        A controller fetches it from the player it picked as a group's source and hands it to each
        member in `joinSource`. The source streams only to a member that presents it, so a device
        that only reaches the audio port hears nothing. The player makes a new key each time it
        starts, so a controller fetches it again after a restart.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The key this player's audio stream admits members with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamKeyAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '500':
          $ref: '#/components/responses/HandlerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/HandlerTimeout'

  /media:
    put:
      operationId: putCacheWindow
      tags: [media]
      summary: Tell the player which tracks to keep, most wanted first.
      description: |
        The player keeps only the tracks on this list, its cache window. When a list arrives, it
        deletes every other track it holds, and from then on it refuses an upload of a track the
        list doesn't name. Each list replaces the one before, and an empty list deletes every track.

        When an upload needs room, the player deletes the tracks listed after it, starting from the
        end of the list.

        After a restart the player has no list. Until one arrives, it keeps the tracks already on
        disk and refuses every upload.

        While an account owns the queue (the `userId` on `setQueue`), the player also downloads the
        listed tracks it doesn't hold from the media server, in the list's order. It skips the track
        it's playing, because it's streaming that one. For a queue no account owns, it downloads
        nothing.

        The answer names the listed tracks the player already holds, so a controller uploads only
        the rest.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        description: The tracks to keep, most wanted first.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheWindow'
      responses:
        '200':
          description: The window is in place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheWindowHeld'
        '400':
          $ref: '#/components/responses/CacheWindowBadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '500':
          $ref: '#/components/responses/CacheWindowFailed'

  /media/{trackId}:
    put:
      operationId: putMedia
      tags: [media]
      x-lint-ignore:
        - owasp-protection-global-unsafe-strict
        - owasp-protection-global-unsafe
      summary: Give the player a track's file to keep.
      description: |
        The body is the file exactly as the media server serves it with `static=true`, so the
        player's copy is the original, bit for bit. Sending a track the player already holds
        replaces it.

        The track must be on the player's cache window, the list `PUT /media` last sent. When the
        file doesn't fit in the media cache, the player makes room by deleting the tracks listed
        after it, starting from the end of the list.

        The player writes the body under a temporary name and renames it once the whole file has
        arrived and reached the disk, so it never plays a track from part of a file. It deletes an
        upload that stops short or goes quiet for 30 seconds.

        Every refusal that doesn't need the body (the token, the track id, the window, the length)
        is answered before `100 Continue`, so a controller sending `Expect: 100-continue` never
        uploads a file the player would refuse.

        The body's cap is the player's media cache size, `mediaCacheGb` in its config file, instead
        of a fixed cap like the other routes have. It must declare a `Content-Length`.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: trackId
          in: path
          required: true
          description: The media server's id for the track, also used as the file's name.
          schema:
            $ref: '#/components/schemas/TrackId'
      requestBody:
        required: true
        description: The track's file.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              minLength: 1
              maxLength: 9007199254740992
              description: |
                The file's bytes. A player refuses a file larger than its `mediaCacheGb` with `413`.
                `maxLength` is the largest cache any player accepts, 2^53 bytes.
      responses:
        '201':
          description: Stored. The player had no copy of this track before.
        '204':
          description: Stored, replacing the player's existing copy.
        '400':
          $ref: '#/components/responses/MediaBadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '404':
          $ref: '#/components/responses/MediaTrackIdRefused'
        '409':
          $ref: '#/components/responses/MediaNotInWindow'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/MediaLargerThanCache'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '500':
          $ref: '#/components/responses/MediaWriteFailed'
        '507':
          $ref: '#/components/responses/MediaCacheFull'

components:
  securitySchemes:
    controllerToken:
      type: http
      scheme: bearer
      description: |
        The token `POST /pair` returned, sent as `Authorization: Bearer <token>`. The server checks
        it against `secrets/controllers`, so an unknown token never reaches TypeScript.

        A token identifies a controller, not a user. Pairing again under a `controllerId` the
        player already knows replaces that record, and its old token stops working. A player keeps
        at most 32 controllers, so pairing a 33rd removes the one paired longest ago.

  parameters:
    ApiVersion:
      name: Atolla-API-Version
      in: header
      required: false
      description: |
        The version of this contract the caller speaks. Absent means 1, so a bare `curl` works.
        Spaces and tabs around the number are ignored. Any other value, including one that isn't a
        whole number, is refused with `unsupported_api_version`, whose `supported` member lists
        what the daemon speaks. `GET /hello` answers any version.
      schema:
        $ref: '#/components/schemas/ApiVersion'
        default: 1

  headers:
    RetryAfter:
      description: Seconds to wait before trying again, repeating the body's `retryAfterSeconds`.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 60
        description: The throttle doubles from 1 second and the limiter caps it at 60.
        examples: [1]

  schemas:
    ApiVersion:
      type: integer
      format: int32
      const: 1
      minimum: 1
      maximum: 1
      description: |
        A version of this contract. There's only one so far, and this is the one place to change
        when a second arrives.
      examples: [1]

    Problem:
      type: object
      description: |
        RFC 9457 problem details, served as `application/problem+json`. `type` is left out, which
        the RFC says means `about:blank`, so it stays free for a documentation URL later. Extension
        members sit alongside the standard ones, and are left out when a problem doesn't carry them.

        `code` is what a client switches on, and it stays stable. `title` is prose and may be
        reworded.
      required: [code, status, title]
      additionalProperties: false
      examples:
        - code: not_found
          status: 404
          title: not found
      properties:
        code:
          type: string
          description: |
            The machine-readable name of the refusal. This list is every code the daemon can send.
            A handler that throws answers `internal`, which is also the fallback when a problem
            won't fit its render buffer.
          enum:
            - body_too_large
            - busy
            - expectation_failed
            - handler_timeout
            - headers_too_large
            - incomplete_body
            - insufficient_storage
            - internal
            - invalid_pairing_code
            - invalid_token
            - length_required
            - malformed_body
            - media_server_id_mismatch
            - media_server_user_mismatch
            - method_not_allowed
            - not_found
            - not_implemented
            - not_in_window
            - too_many_attempts
            - unavailable
            - unsupported_api_version
          examples: [invalid_pairing_code]
        detail:
          type: string
          maxLength: 128
          pattern: '^[ -~]+$'
          description: |
            Rarely sent, because naming the field that failed would tell a stranger on the LAN
            posting to `/pair` what to fix. Printable ASCII, and short: the whole rendered problem
            has to fit in 256 bytes, or the daemon sends `internal` instead.
          examples: ['try later']
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          description: |
            How long to wait before trying again, repeated in the `Retry-After` header. The hold
            doubles from 1 second, up to 60.
          examples: [1]
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: The HTTP status this body accompanies.
          examples: [400]
        supported:
          type: array
          items:
            $ref: '#/components/schemas/ApiVersion'
          description: The API versions the daemon speaks. Sent with `unsupported_api_version`.
          examples:
            - [1]
        title:
          type: string
          maxLength: 64
          pattern: '^[a-z ]+$'
          description: |
            A short summary of the refusal, in lowercase words. It's prose, so switch on `code`
            instead.
          examples: ['not found']

    Hello:
      type: object
      description: A player's identity, constant for the life of the process.
      required: [apiVersions, id, name, tier, v, version]
      additionalProperties: false
      properties:
        apiVersions:
          type: array
          items:
            $ref: '#/components/schemas/ApiVersion'
          minItems: 1
          description: Every version of this contract the daemon speaks.
          examples:
            - [1]
        audioPort:
          $ref: '#/components/schemas/AudioPort'
          description: |
            Where this player streams its audio for others to join. It's absent when the player
            streams none, because the port was taken or the player predates streaming, and then it
            can't be a group's source. The host is the one the controller reached this player at.
          examples: [45891]
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: The player's stable identifier, minted once and kept in its data directory.
          examples: [4f3c9a1de8b27065]
        name:
          type: string
          maxLength: 256
          pattern: '^[^\r\n]*$'
          description: |
            The display name from the player's config, empty if none was set. The whole `/hello`
            body has to fit in 1 KiB, so a very long name stops the route answering at all.
          examples: [Kitchen]
        tier:
          type: string
          enum: [loose, tight]
          description: |
            How tightly this player can synchronise. A daemon is `tight`. `loose` is for a phone
            playing as part of a group, which isn't built yet.
          examples: [tight]
        v:
          $ref: '#/components/schemas/ApiVersion'
          description: |
            The current API version, the same as the last entry in `apiVersions`.
          examples: [1]
        version:
          type: string
          pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$'
          description: The atolla build the daemon is running.
          examples: ['0.0.0']

    UserId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[ -~]+$'
      description: |
        A media server account. The player keys credentials on it, not on the controller, so two of
        one person's phones replace each other's credential instead of holding two.
      examples: [8b1f2c3d4e5f6071]

    MediaServer:
      type: object
      description: |
        A media server credential for the player to use on its own behalf. The player holds one per
        account and never writes them to disk, so a controller pushes it again with
        `PUT /media-server` after a restart.
      required: [accessToken, baseUrl, deviceId, serverId, userId]
      additionalProperties: true
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[ -~]+$'
          description: A token minted for this player, revocable without touching the user's login.
          examples: [3d9f0c1b7a5e4826]
        baseUrl:
          type: string
          minLength: 1
          maxLength: 512
          format: uri
          description: |
            Where the media server answers, as this controller reaches it. Two controllers may
            spell the same server differently, one as an mDNS name and one as a typed address. Each
            credential keeps its own, and the player uses the one that belongs to whoever owns the
            queue. `serverId` is what identifies the server.
          examples: ['http://jellyfin.local:8096']
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          description: |
            The device identity the token was minted against, naming the account as well as the
            player: `atolla-<playerId>-<userId>`. Jellyfin signs out the earlier sessions on a
            device when it issues a new token for it, so a shared id would let one person's
            re-provisioning sign the others out. It also means that minting twice for the same
            player and account leaves only the second token working.
          examples: [atolla-4f3c9a1de8b27065-8b1f2c3d4e5f6071]
        serverId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          description: |
            The media server's own identifier, which a push is compared against. A player uses one
            server, and a push naming another is refused with `media_server_id_mismatch`.
          examples: [7e0a5b9c2d4f8613]
        userId:
          $ref: '#/components/schemas/UserId'

    PairRequest:
      type: object
      description: |
        `pair.zig` enforces every length cap here before the request crosses the bridge. It ignores
        an unknown member, so a v1 daemon doesn't refuse a body a newer controller added a field
        to.
      required: [code, controllerId, controllerName]
      additionalProperties: true
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^\d{8}$'
          description: |
            The player's pairing code. The daemon ignores whitespace, so the spaced form the
            player prints works too. It enforces only a 32-byte cap here, so a code of the wrong
            shape is a `401`, not a `400`, and the caller learns nothing about it.
          examples: ['19524002']
        controllerId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          description: |
            Stable per controller. Pairing again under an id the player already knows replaces that
            record, and the old token stops working.
          examples: [phone-1]
        controllerName:
          type: string
          maxLength: 128
          pattern: '^[^\r\n]*$'
          description: |
            Shown to the user when they review what's paired. It may be empty, but a body without
            it is refused.
          examples: ['pixel 8']
        mediaServer:
          $ref: '#/components/schemas/MediaServer'

    PairAccepted:
      type: object
      description: The credential the controller sends on every later request.
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            256 bits of entropy, hex encoded. Nothing types this, so it shares no shape with the
            pairing code.
          examples:
            - 7c1e5a9b3d8f204617ca0be9352d8f7461a0c3d95e28b7f4016cad3928bf5e7d

    StreamKey:
      type: string
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-f]{64}$'
      description: |
        256 bits of entropy, hex encoded, that a source's audio stream admits members with. The
        player holds it in memory only and makes a new one each time it starts.
      examples:
        - 3e9d1f7a5c0b8246e1d3f5a7c9b0e2d4f6a8c1e3b5d7f9a0c2e4b6d8f1a3c5e7

    StreamKeyAnswer:
      type: object
      description: The key a controller passes to each member it sends to join this player.
      required: [key]
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/StreamKey'

    TrackId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: The media server's id for a track, also the name of the player's copy on disk.
      examples: [9f2c4e1a7b3d5068e4a1c2b3d4e5f607]

    CacheWindow:
      type: object
      description: |
        The tracks the player's media cache keeps. An unknown member is ignored, so a v1 daemon
        doesn't refuse a body a newer controller added a field to.
      required: [trackIds]
      additionalProperties: true
      properties:
        trackIds:
          type: array
          maxItems: 35
          uniqueItems: true
          description: |
            Most wanted first, since the player makes room by deleting from the end. 35 is the
            largest window the app's track cache setting allows.
          items:
            $ref: '#/components/schemas/TrackId'
          examples:
            - [9f2c4e1a7b3d5068e4a1c2b3d4e5f607, 1a2b3c4d5e6f70819a0b1c2d3e4f5061]

    CacheWindowHeld:
      type: object
      description: Which of the window's tracks the player already holds.
      required: [held]
      additionalProperties: false
      properties:
        held:
          type: array
          maxItems: 35
          description: In the window's order. A controller uploads only the tracks missing here.
          items:
            $ref: '#/components/schemas/TrackId'
          examples:
            - [9f2c4e1a7b3d5068e4a1c2b3d4e5f607]

    StateVersion:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
      description: |
        A counter the player bumps whenever the state a controller mirrors changes. It only orders
        changes, and doesn't count commands: one command can change several fields, and some
        changes have no command behind them.

        Nothing persists it, so it starts again at 1 when the daemon restarts. A `since` that
        matches the current version waits, which is what a poll is for. Any other `since` is
        answered straight away with the current snapshot, so a controller that outlived a restart
        usually gets one snapshot it may already hold, takes the version in it, and carries on. The
        new count can match the old `since` by chance, so a controller that lost contact with the
        player should drop `since` for its next read. Versions are ordered within one run of the
        daemon, and comparing them across runs means nothing.

        At one bump a second, the 32-bit ceiling takes 68 years to reach, and it keeps the value
        exact in every JSON parser. An `int64` wouldn't, for a client that reads it as a JavaScript
        number.
      examples: [412]

    TrackIndex:
      type: integer
      format: int32
      minimum: 0
      maximum: 100000
      description: |
        A position in the queue, counted from zero. The server holds no queue of its own, so the
        bound is only a sanity check, well above what the 1 MiB body cap lets a `setQueue` deliver.
        Whether the index falls inside the player's current queue is checked after the request
        crosses the bridge.
      examples: [3]

    Tracks:
      type: array
      maxItems: 10000
      description: |
        The queue a command carries. The server hands this array across the bridge without parsing
        it, so it enforces neither the member shape nor `maxItems`. The 1 MiB body cap is what
        refuses an oversized queue, and a queue reaches it first anyway. The handler on the other
        side checks the shape, and refuses the body as `malformed_body` if a member isn't a track.
      items:
        $ref: '#/components/schemas/Track'
      examples:
        - - duration: 293.4
            id: 1a2b3c4d5e6f7081
            name: Xtal

    CommandBare:
      type: object
      description: The commands that carry no members beyond their own name.
      required: [command]
      additionalProperties: true
      properties:
        command:
          type: string
          enum: [next, pause, previous, shuffle]
          description: |
            `pause` stops the current track where it is, `next` and `previous` move between
            tracks, and `shuffle` reorders what hasn't played yet.

            `previous` behaves like the button: the player restarts the current track when it's
            more than three seconds in, and steps back otherwise, as the phone does.
          examples: [pause]

    CommandPlay:
      type: object
      description: Play the current track from the position the player holds.
      required: [command]
      additionalProperties: true
      properties:
        command:
          type: string
          const: play

    CommandSeek:
      type: object
      description: Move within the current track.
      required: [command, positionMs]
      additionalProperties: true
      properties:
        command:
          type: string
          const: seek
        positionMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400000
          description: |
            Where to move to, from the start of the track, in milliseconds to match `/state`'s
            `positionMs`. The player itself works in seconds and rounds. The bound is a day, which
            no track reaches. Whether the position falls inside the current track is checked after
            the request crosses the bridge.
          examples: [91234]

    CommandJumpToIndex:
      type: object
      description: Play a track already in the queue.
      required: [command, trackIndex]
      additionalProperties: true
      properties:
        command:
          type: string
          const: jumpToIndex
        trackId:
          $ref: '#/components/schemas/CommandTrackId'
        trackIndex:
          $ref: '#/components/schemas/TrackIndex'

    CommandSetQueue:
      type: object
      description: |
        Replace the queue outright and start playing. It's the largest JSON body the API takes, and
        the reason `/command`'s cap is 1 MiB when the other JSON routes allow a few KiB. A
        `setQueue` the player applies sets its `assigned`.

        `userId` claims the queue for that account, and the player fetches tracks with that
        account's credential until the queue is replaced or emptied. Replacing a queue takes
        ownership outright, unlike `addToQueue` and `playNext`, because the user chose everything
        in it. Leaving `userId` out leaves the queue unowned, which is what a controller sends
        offline or before it has provisioned anything. A `setQueue` with no tracks clears the owner
        along with the queue.
      required: [command, tracks]
      additionalProperties: true
      properties:
        album:
          $ref: '#/components/schemas/Album'
          description: |
            The album the queue came from, when it came from one. A queue with no album behind it,
            such as a shuffle across an artist, leaves it out. The server passes it through
            unparsed, as it does `tracks`.

            A malformed album is dropped and the command still applies. It's the one place this
            route is lenient: the tracks are what the user asked to hear, and the album is only the
            context they're shown in. A malformed `tracks` is refused.
        command:
          type: string
          const: setQueue
        trackIndex:
          $ref: '#/components/schemas/TrackIndex'
        tracks:
          $ref: '#/components/schemas/Tracks'
        userId:
          $ref: '#/components/schemas/UserId'

    CommandAddToQueue:
      type: object
      description: |
        Append tracks to the end of the queue.

        `userId` claims the queue only when nothing owns it yet. Adding to somebody else's queue
        doesn't take it over, so a guest can queue a track without the whole queue moving to their
        account.
      required: [command, tracks]
      additionalProperties: true
      properties:
        command:
          type: string
          const: addToQueue
        tracks:
          $ref: '#/components/schemas/Tracks'
        userId:
          $ref: '#/components/schemas/UserId'

    CommandPlayNext:
      type: object
      description: |
        Insert tracks directly after the current one, ahead of the rest of the queue.

        `userId` claims the queue only when nothing owns it yet, as `addToQueue` does.
      required: [command, tracks]
      additionalProperties: true
      properties:
        command:
          type: string
          const: playNext
        tracks:
          $ref: '#/components/schemas/Tracks'
        userId:
          $ref: '#/components/schemas/UserId'

    CommandRemoveAt:
      type: object
      description: Drop one track from the queue.
      required: [command, trackIndex]
      additionalProperties: true
      properties:
        command:
          type: string
          const: removeAt
        trackId:
          $ref: '#/components/schemas/CommandTrackId'
        trackIndex:
          $ref: '#/components/schemas/TrackIndex'

    CommandMove:
      type: object
      description: Reorder the queue by moving one track.
      required: [command, fromIndex, toIndex]
      additionalProperties: true
      properties:
        command:
          type: string
          const: move
        fromIndex:
          $ref: '#/components/schemas/TrackIndex'
        toIndex:
          $ref: '#/components/schemas/TrackIndex'
        trackId:
          $ref: '#/components/schemas/CommandTrackId'

    CommandSetLoopMode:
      type: object
      description: |
        Choose how the queue repeats. The controller names the mode it wants, instead of asking the
        player to cycle to the next one, because a mirror a long poll behind would cycle from a mode
        the player has already left.
      required: [command, loopMode]
      additionalProperties: true
      properties:
        command:
          type: string
          const: setLoopMode
        loopMode:
          type: string
          enum: [none, queue, track]
          description: |
            `none` stops at the end of the queue, `queue` starts it again, `track` repeats the
            current one.
          examples: [queue]

    CommandJoinSource:
      type: object
      description: |
        Play the audio another player streams, the source a controller picked for the group. With
        `host`, `port` and `key` left out, it leaves the source instead. Joining pauses this
        player's own queue. The player connects straight away and reports how that's going in its
        member's `source`, so an unreachable source, or one that refuses the key, still answers
        `202`. Joining the source it already joined, with the same key, changes nothing. Any
        `joinSource`, joining or leaving, sets the player's `assigned`.
      required: [command]
      dependentRequired:
        host: [port, key]
        port: [host, key]
        key: [host, port]
      additionalProperties: true
      properties:
        command:
          type: string
          const: joinSource
        host:
          $ref: '#/components/schemas/PlayerHost'
        key:
          $ref: '#/components/schemas/StreamKey'
          description: The source's `GET /stream-key`, which the source admits this player with.
        port:
          $ref: '#/components/schemas/AudioPort'

    CommandTrackId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[ -~]+$'
      description: |
        The track the controller expects to find at the position it named. It's optional, but worth
        sending: the player drops the command when the id doesn't match, so a stale mirror can't
        reorder or delete the wrong track. A command without it applies to whatever is at that
        position.
      examples: [3c4d5e6f708192a3]

    Command:
      description: |
        One command for the player. `command` names it, and the other members belong to that name.
        An unknown name is `malformed_body`, and so is a missing or wrongly typed member of a name
        the player knows.

        A member that belongs to no command is ignored, as in `PairRequest`, so a v1 daemon keeps
        accepting a body a newer controller added a field to. That's why each variant allows extra
        members.
      oneOf:
        - $ref: '#/components/schemas/CommandBare'
        - $ref: '#/components/schemas/CommandPlay'
        - $ref: '#/components/schemas/CommandSeek'
        - $ref: '#/components/schemas/CommandJumpToIndex'
        - $ref: '#/components/schemas/CommandSetQueue'
        - $ref: '#/components/schemas/CommandAddToQueue'
        - $ref: '#/components/schemas/CommandPlayNext'
        - $ref: '#/components/schemas/CommandRemoveAt'
        - $ref: '#/components/schemas/CommandMove'
        - $ref: '#/components/schemas/CommandSetLoopMode'
        - $ref: '#/components/schemas/CommandJoinSource'
      discriminator:
        propertyName: command
        mapping:
          addToQueue: '#/components/schemas/CommandAddToQueue'
          joinSource: '#/components/schemas/CommandJoinSource'
          jumpToIndex: '#/components/schemas/CommandJumpToIndex'
          move: '#/components/schemas/CommandMove'
          next: '#/components/schemas/CommandBare'
          pause: '#/components/schemas/CommandBare'
          play: '#/components/schemas/CommandPlay'
          playNext: '#/components/schemas/CommandPlayNext'
          previous: '#/components/schemas/CommandBare'
          removeAt: '#/components/schemas/CommandRemoveAt'
          seek: '#/components/schemas/CommandSeek'
          setLoopMode: '#/components/schemas/CommandSetLoopMode'
          setQueue: '#/components/schemas/CommandSetQueue'
          shuffle: '#/components/schemas/CommandBare'

    CommandAccepted:
      type: object
      description: |
        The version the command produced. `GET /state?since=` with any other version answers
        straight away, so a controller can read the result of its own command without waiting for
        the next change. It reflects the queue, not what the speakers have done since.
      required: [version]
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'

    MediaServerAccepted:
      type: object
      description: |
        The version the push produced. The bump is what tells a controller already long polling
        that the player now holds the credential. Without it, the controller would wait on `/state`
        until something else changed.
      required: [version]
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'

    Track:
      type: object
      description: |
        A track, as much of one as a controller needs. `atolla_core/src/models/Track.ts` is the one
        definition, and holds a good deal more: release dates, sort names, genres, disc and track
        numbers. The daemon passes all of it on untouched. This schema leaves those members out,
        because nothing reading a snapshot depends on them, and listing them here would be a second
        definition to keep in step.

        It describes the members the interface requires, plus the ones a controller shows and
        navigates from. Anything else the media server supplied arrives alongside them.
      required: [duration, id, name]
      additionalProperties: true
      properties:
        albumId:
          type: string
          maxLength: 64
          pattern: '^[ -~]+$'
          description: So a controller can offer to open the album this came from.
          examples: [6f2b8c4d1e9a3705]
        albumImageUrl:
          type: string
          maxLength: 2048
          format: uri
          description: |
            The artwork. A controller can't work this out for itself, so it travels with the track.
          examples: ['http://jellyfin.local:8096/Items/6f2b8c4d/Images/Primary']
        albumName:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Selected Ambient Works]
        artistId:
          type: string
          maxLength: 64
          pattern: '^[ -~]+$'
          examples: [1c4e7a09]
        artistName:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Aphex Twin]
        duration:
          type: number
          format: double
          minimum: 0
          maximum: 86400
          description: |
            In seconds, because that's what the store and the audio engine work in. The playback
            position is in milliseconds, because a position needs finer resolution than a length.
          examples: [293.4]
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          description: |
            The media server's identifier. A command that names a queue position may carry it as a
            check, and the native player matches the track it's playing by it.
          examples: [1a2b3c4d5e6f7081]
        name:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Xtal]

    Album:
      type: object
      description: |
        The album a queue came from, so a controller can say what's playing without looking it up.
        As with `Track`, this covers what a controller depends on, not everything
        `atolla_core/src/models/Album.ts` holds.
      required: [artistId, artistName, id, name]
      additionalProperties: true
      properties:
        artistId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          examples: [1c4e7a09]
        artistName:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Aphex Twin]
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          examples: [6f2b8c4d1e9a3705]
        imageUrl:
          type: string
          maxLength: 2048
          format: uri
          examples: ['http://jellyfin.local:8096/Items/6f2b8c4d/Images/Primary']
        name:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Selected Ambient Works]

    PlayerState:
      type: string
      enum: [idle, paused, playing]
      description: |
        What a player is doing. `idle` means nothing is queued, which isn't the same as holding a
        queue it has paused.
      examples: [playing]

    PlayerHost:
      type: string
      minLength: 1
      maxLength: 253
      pattern: '^[!-~]+$'
      description: Another player's address, an IP or a host name, as the controller reaches it.
      examples: ['192.168.1.42']

    AudioPort:
      type: integer
      format: int32
      minimum: 1
      maximum: 65535
      description: The TCP port a player streams its audio on, `audioPort` in its `player.json`.
      examples: [45891]

    MemberSource:
      type: object
      description: |
        The source a member was told to join with `joinSource`, absent while it plays its own
        queue. `receiving` says whether it holds audio from that source still to play. It's false
        until the source is reached and its clock has synced, and false again once the source stops
        sending. A member that restarts has forgotten what it joined, and reports
        `assigned: false`.
      required: [host, port, receiving]
      additionalProperties: true
      properties:
        host:
          $ref: '#/components/schemas/PlayerHost'
        port:
          $ref: '#/components/schemas/AudioPort'
        receiving:
          type: boolean
          examples: [true]

    Member:
      type: object
      description: |
        A player in the group. A daemon reports only itself today, so this array has one entry.
      required: [assigned, enabled, id, name, state, tier]
      additionalProperties: true
      properties:
        assigned:
          type: boolean
          description: |
            Whether this player has been given a queue (`setQueue`) or a source (`joinSource`)
            since it started. A restart clears it, so a controller that sees it go false knows to
            send everything again.
          examples: [true]
        enabled:
          type: boolean
          description: |
            Whether this member plays. The enabled set defines the group, so a player that's
            present but not enabled is one the user switched off, not one that failed. A daemon
            reports only itself today, so this is always `true`.
          examples: [true]
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: The stable player id, the same one `GET /hello` reports.
          examples: [4f3c9a1de8b27065]
        name:
          type: string
          maxLength: 256
          pattern: '^[^\r\n]*$'
          examples: [Kitchen]
        source:
          $ref: '#/components/schemas/MemberSource'
        state:
          $ref: '#/components/schemas/PlayerState'
        tier:
          type: string
          enum: [loose, tight]
          description: How tightly this member can synchronise, as `GET /hello` reports it.
          examples: [tight]

    StateSnapshot:
      type: object
      description: |
        Everything a controller mirrors, replaced whole on each read. A controller applies it and
        then asks again with the `version` it applied.
      required: [group, leader, members, playback, queue, version]
      additionalProperties: true
      properties:
        group:
          type: string
          maxLength: 64
          pattern: '^[^\r\n]*$'
          description: |
            Which group this snapshot describes. There's one, called `default`. It's on the wire
            from the start so that zones can be added later without a redesign.
          examples: [default]
        leader:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: |
            The player that owns the queue. A daemon reports only itself today, so this is always
            its own id.
          examples: [4f3c9a1de8b27065]
        members:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Member'
          examples:
            - - assigned: true
                enabled: true
                id: 4f3c9a1de8b27065
                name: Kitchen
                state: playing
                tier: tight
        playback:
          type: object
          required: [isPlaying, loopMode, positionAtMs, positionMs]
          additionalProperties: true
          properties:
            isPlaying:
              type: boolean
              examples: [true]
            loopMode:
              type: string
              enum: [none, queue, track]
              examples: [none]
            positionAtMs:
              type: integer
              format: int64
              minimum: 0
              maximum: 99999999999999
              description: |
                The player's wall clock when it read `positionMs`, in epoch milliseconds. The
                player's and the controller's clocks aren't synchronised, so this is only good for
                elapsed time. A controller takes the difference from its own clock as the snapshot
                arrives, keeps it, and extrapolates from there. Treating it as a time on the
                controller's own clock puts the progress bar out by however far the clocks differ.
              examples: [1758000000000]
            positionMs:
              type: integer
              format: int64
              minimum: 0
              maximum: 86400000
              description: |
                How far into the current track the player was at `positionAtMs`. The pair lets a
                controller run a smooth progress bar between snapshots instead of asking for the
                position over and over. Position is the only part of the state that changes all the
                time, so the long poll couldn't report it usefully without the pair.
              examples: [91234]
        queue:
          type: object
          description: |
            What the player is playing through. `owner` is the account the queue belongs to,
            absent when nothing has claimed it. The player fetches tracks with that account's
            credential. The owner is only an account id, so it survives a restart, but the
            credential it selects doesn't.
          required: [trackIndex, tracks]
          additionalProperties: true
          properties:
            album:
              $ref: '#/components/schemas/Album'
            owner:
              $ref: '#/components/schemas/UserId'
            trackIndex:
              $ref: '#/components/schemas/TrackIndex'
            tracks:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/Track'
        sourceHealth:
          type: object
          description: |
            How well the player can reach the media server. A member that's absent means the
            player has nothing to say about it yet, not that the answer is no.
          additionalProperties: true
          properties:
            mediaServerUsers:
              type: array
              maxItems: 64
              description: |
                Which accounts the player holds a credential for, never the credentials themselves.
                Nothing reads a credential back, and the only way in is `PUT /media-server`. A
                controller looks for its own account and pushes when it's missing, which is how a
                player that lost its credentials to a restart gets them back without asking anyone.
                Reporting the set, instead of a yes or no, keeps one body per version instead of one
                that depends on who asked.
              items:
                $ref: '#/components/schemas/UserId'
              examples:
                - [8b1f2c3d4e5f6071]
        version:
          $ref: '#/components/schemas/StateVersion'

  examples:
    incompleteBody:
      description: The body stopped short of its declared length.
      value:
        code: incomplete_body
        status: 400
        title: incomplete body
    malformedBody:
      description: The body is not the shape this route accepts.
      value:
        code: malformed_body
        status: 400
        title: malformed body
    unsupportedApiVersion:
      description: The version header named a version the daemon doesn't speak.
      value:
        code: unsupported_api_version
        status: 400
        supported: [1]
        title: unsupported api version
    mediaServerIdMismatch:
      description: The push named a different media server than the one the player already holds.
      value:
        code: media_server_id_mismatch
        status: 409
        title: media server id mismatch
    notInWindow:
      description: The player's cache window doesn't list the track.
      value:
        code: not_in_window
        status: 409
        title: not in window
    mediaServerUserMismatch:
      description: The media server says the pushed token isn't valid for the account it names.
      value:
        code: media_server_user_mismatch
        status: 422
        title: media server user mismatch
    invalidPairingCode:
      description: The code did not match, or the daemon has none provisioned.
      value:
        code: invalid_pairing_code
        status: 401
        title: invalid pairing code
    invalidToken:
      description: The `Authorization` header was missing, malformed, or named an unknown token.
      value:
        code: invalid_token
        status: 401
        title: invalid token
    notFound:
      description: No route serves this path.
      value:
        code: not_found
        status: 404
        title: not found
    methodNotAllowed:
      description: A route serves this path, but not by this method.
      value:
        code: method_not_allowed
        status: 405
        title: method not allowed
    lengthRequired:
      description: The request was chunked, so its length was not known up front.
      value:
        code: length_required
        status: 411
        title: length required
    bodyTooLarge:
      description: The declared length exceeds the route's cap, so no byte of it was read.
      value:
        code: body_too_large
        status: 413
        title: body too large
    expectationFailed:
      description: The request carried an `Expect` the daemon cannot meet.
      value:
        code: expectation_failed
        status: 417
        title: expectation failed
    tooManyAttempts:
      description: Too many wrong pairing codes, so callers are held for a while.
      value:
        code: too_many_attempts
        retryAfterSeconds: 1
        status: 429
        title: too many attempts
    headersTooLarge:
      description: The request head did not fit the daemon's buffer.
      value:
        code: headers_too_large
        status: 431
        title: headers too large
    unavailable:
      description: Nothing was attached to answer, or every bridge slot was in use.
      value:
        code: unavailable
        status: 503
        title: unavailable
    busy:
      description: The connection cap was reached, so the request was refused unread.
      value:
        code: busy
        retryAfterSeconds: 1
        status: 503
        title: busy
    handlerTimeout:
      description: The handler did not answer within 28 seconds.
      value:
        code: handler_timeout
        status: 504
        title: handler timeout
    internalError:
      description: The handler threw.
      value:
        code: internal
        status: 500
        title: internal error
    insufficientStorage:
      description: The player's media cache has no room for the file.
      value:
        code: insufficient_storage
        status: 507
        title: insufficient storage

  responses:
    BadRequest:
      description: |
        Refused before the route could act. `incomplete_body` means the connection went quiet
        partway through the body. `unsupported_api_version` means the version header named a
        version the daemon doesn't speak.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            incompleteBody:
              $ref: '#/components/examples/incompleteBody'
            unsupportedApiVersion:
              $ref: '#/components/examples/unsupportedApiVersion'

    PairBadRequest:
      description: |
        As `BadRequest`, plus `malformed_body` for a body that is not JSON, is missing a member, or
        carries one past its cap. The pairing code is not consulted, and the attempt counts against
        this caller's address only.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            incompleteBody:
              $ref: '#/components/examples/incompleteBody'
            malformedBody:
              $ref: '#/components/examples/malformedBody'
            unsupportedApiVersion:
              $ref: '#/components/examples/unsupportedApiVersion'

    CommandBadRequest:
      description: |
        As `BadRequest`, plus `malformed_body` for a body that is not JSON, does not name a command
        this player accepts, or omits a member the named command requires. A member belonging to no
        command is ignored rather than refused.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            incompleteBody:
              $ref: '#/components/examples/incompleteBody'
            malformedBody:
              $ref: '#/components/examples/malformedBody'
            unsupportedApiVersion:
              $ref: '#/components/examples/unsupportedApiVersion'

    MediaServerBadRequest:
      description: |
        As `BadRequest`, plus `malformed_body` for a body that is not JSON, is missing a member, or
        carries one past its cap. Nothing is stored, and the credential the player already holds for
        this account is left as it was.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            incompleteBody:
              $ref: '#/components/examples/incompleteBody'
            malformedBody:
              $ref: '#/components/examples/malformedBody'
            unsupportedApiVersion:
              $ref: '#/components/examples/unsupportedApiVersion'

    CacheWindowBadRequest:
      description: |
        As `BadRequest`, plus `malformed_body` for a body that isn't JSON, lists more than 35
        tracks, lists one twice, or names one by an id `PUT /media/{trackId}` would refuse. The
        player keeps the window it had and deletes nothing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            incompleteBody:
              $ref: '#/components/examples/incompleteBody'
            malformedBody:
              $ref: '#/components/examples/malformedBody'
            unsupportedApiVersion:
              $ref: '#/components/examples/unsupportedApiVersion'

    CacheWindowFailed:
      description: |
        The player couldn't read its media cache or delete a track from it, and its log says why.
        The new window is in place, but some of the tracks it drops may stay on disk until the next
        window or upload arrives.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              $ref: '#/components/examples/internalError'

    MediaBadRequest:
      description: |
        As `BadRequest`, plus `malformed_body` for an empty body. Here `incomplete_body` also covers
        an upload that went quiet for 30 seconds. Nothing is stored, and any copy the player already
        held is kept.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            incompleteBody:
              $ref: '#/components/examples/incompleteBody'
            malformedBody:
              $ref: '#/components/examples/malformedBody'
            unsupportedApiVersion:
              $ref: '#/components/examples/unsupportedApiVersion'

    MediaTrackIdRefused:
      description: |
        The track id contains something other than letters, digits, dashes and underscores, or is
        longer than 128 bytes, so it could never name a file the player keeps. Nothing is read or
        stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              $ref: '#/components/examples/notFound'

    MediaNotInWindow:
      description: |
        The player's cache window doesn't list this track, or no window has arrived since the player
        started. The body was not read. Send the window with `PUT /media` first.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notInWindow:
              $ref: '#/components/examples/notInWindow'

    MediaLargerThanCache:
      description: |
        The declared `Content-Length` is larger than the player's whole media cache (`mediaCacheGb`
        in its config file), so the track could never be stored. The body was not read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            bodyTooLarge:
              $ref: '#/components/examples/bodyTooLarge'

    MediaCacheFull:
      description: |
        Deleting every track listed after this one wouldn't make room: the tracks listed ahead of it
        and the uploads still arriving leave too little space in the media cache. The player deletes
        none of the listed tracks and doesn't read the body. It also answers this when the disk
        fills while it writes the file, and deletes the partial file, so nothing is stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            insufficientStorage:
              $ref: '#/components/examples/insufficientStorage'

    MediaWriteFailed:
      description: |
        The player could not write or keep the file, and its log says why. Nothing is stored, and
        any copy it already held is kept.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              $ref: '#/components/examples/internalError'

    InvalidPairingCode:
      description: |
        The code doesn't match, or the daemon has no code set up. Both get the same answer on
        purpose.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidPairingCode:
              $ref: '#/components/examples/invalidPairingCode'

    InvalidToken:
      description: |
        The request carried no usable `Authorization: Bearer` token. A missing header, a malformed
        one and an unknown token all get this same answer, so a caller learns nothing about which
        tokens exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidToken:
              $ref: '#/components/examples/invalidToken'

    NotFound:
      description: No route serves the requested path. Answered before an operation is selected.
      x-lint-ignore: oas3-unused-component
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              $ref: '#/components/examples/notFound'

    MethodNotAllowed:
      description: |
        A route serves the path, but not by the method used. Answered before an operation is
        selected.
      x-lint-ignore: oas3-unused-component
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            methodNotAllowed:
              $ref: '#/components/examples/methodNotAllowed'

    MediaServerIdMismatch:
      description: |
        The player already holds a credential for a different `serverId`, and a speaker serves one
        household and one server. Nothing is stored, and any credential already held for that
        account is left as it was.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            mediaServerIdMismatch:
              $ref: '#/components/examples/mediaServerIdMismatch'

    MediaServerUserMismatch:
      description: |
        The media server says the token isn't valid for the `userId` the push names. The player
        checks, because the controller asserts the account and a wrong one would otherwise go
        unnoticed. A token Jellyfin has since signed out, because a newer one was minted for the
        same player and account, is refused the same way. The body was well formed, which is what
        separates this from a `400`.

        Nothing is stored, and any credential already held for that account is left as it was.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            mediaServerUserMismatch:
              $ref: '#/components/examples/mediaServerUserMismatch'

    LengthRequired:
      description: |
        The request used chunked transfer encoding. The daemon refuses a body whose size it cannot
        know before reading it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            lengthRequired:
              $ref: '#/components/examples/lengthRequired'

    BodyTooLarge:
      description: |
        The declared `Content-Length` is over the route's cap, so the body was never read.
        `GET /hello` takes no body. `/pair`, `/media-server`, `/state` and `/stream-key` take up
        to 4 KiB, and `PUT /media` 8 KiB. `/command` takes 1 MiB, because a `setQueue` carries the
        whole queue. `PUT /media/{trackId}` is capped by the media cache size instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            bodyTooLarge:
              $ref: '#/components/examples/bodyTooLarge'

    ExpectationFailed:
      description: |
        The request carried an `Expect` other than `100-continue`. The daemon honours
        `100-continue`: a request it refuses before reading the body gets the refusal instead of
        `100 Continue`, so the body is never sent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            expectationFailed:
              $ref: '#/components/examples/expectationFailed'

    TooManyAttempts:
      description: |
        Too many wrong pairing codes, from this address or from every address together, so the
        caller has to wait before trying again.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooManyAttempts:
              $ref: '#/components/examples/tooManyAttempts'

    HeadersTooLarge:
      description: |
        The request head was over 8 KiB, so it was never parsed. Answered before an operation is
        selected.
      x-lint-ignore: oas3-unused-component
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            headersTooLarge:
              $ref: '#/components/examples/headersTooLarge'

    Unavailable:
      description: |
        The request could not be handed to TypeScript: nothing is attached to answer, or every
        bridge slot was in use.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              $ref: '#/components/examples/unavailable'

    Busy:
      description: |
        The daemon is already serving its maximum of 32 connections, so this one was refused
        without a request being read.
      x-lint-ignore: oas3-unused-component
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            busy:
              $ref: '#/components/examples/busy'

    HandlerTimeout:
      description: The handler was given the request but did not answer within 28 seconds.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            handlerTimeout:
              $ref: '#/components/examples/handlerTimeout'


    HandlerFailed:
      description: |
        The handler threw. The daemon's log says what went wrong. The problem only says that
        something did, because a caller on the LAN doesn't need to know more.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              $ref: '#/components/examples/internalError'
