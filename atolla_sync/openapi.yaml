openapi: 3.1.0
x-lint-ignore:
  - owasp-rate-limit
  - owasp-no-additionalProperties
  - owasp-constrained-additionalProperties

info:
  title: atolla control API
  version: '1'
  summary: The HTTP surface a controller uses to pair with and drive a headless atolla player.
  contact:
    email: no@email.com
    name: atolla
    url: https://github.com/tx3stn/atolla
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: |
    One daemon per speaker-attached device, listening on port 45889 by default. This document
    describes what the daemon answers today, not what the protocol will grow into.

    `http_server.zig` answers anything it can reject without crossing into TypeScript: framing,
    per-connection limits, method and path matching, the version header, the pairing-code
    comparison, and the protocol shape of a body. Surviving requests cross the bridge once, and
    `Server.ts` switches on the route.

    ### Answers that precede route selection

    Four refusals are decided before an operation is chosen, so they are listed under
    `components.responses` rather than on any operation:

    | Response | Cause |
    |---|---|
    | `NotFound` | a path not in the router's table |
    | `MethodNotAllowed` | a path in the table reached with another method |
    | `HeadersTooLarge` | a request head over 8 KiB |
    | `Busy` | the connection cap (32) was already reached, so no request was read |

servers:
  - url: http://{host}:{port}
    description: A player on the local network.
    variables:
      host:
        default: 127.0.0.1
        description: The address the daemon bound, or the one a beacon advertised.
      port:
        default: '45889'
        description: The control port, overridable with `atolla config --port`.
    x-lint-ignore: owasp-security-hosts-https-oas3

security:
  - controllerToken: []

tags:
  - name: discovery
    description: Learning what a player is and what it speaks, before holding a credential.
  - name: pairing
    description: Trading the player's pairing code for a controller token.
  - name: control
    description: Driving playback and mirroring player state.

paths:
  /hello:
    get:
      operationId: getHello
      tags: [discovery]
      security: []
      summary: Identity and the API versions this player speaks.
      description: |
        Unauthenticated, and the one route that answers whatever version it is asked for: refusing
        discovery on a version mismatch would leave a mixed-version fleet unable to find out why.

        The body is built once at startup and served verbatim by the server, so it keeps answering
        while the JS thread is busy. Every field is a process-lifetime constant; anything that
        changes lives in the beacon or `/state`. Takes no body.
      responses:
        '200':
          description: The player's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hello'
              example:
                apiVersions: [1]
                id: 4f3c9a1de8b27065
                name: Kitchen
                tier: tight
                v: 1
                version: 0.0.0
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'

  /pair:
    post:
      operationId: pair
      tags: [pairing]
      security: []
      x-lint-ignore: 
        - owasp-protection-global-unsafe-strict
        - owasp-protection-global-unsafe
      summary: Trade the player's pairing code for a controller token.
      description: |
        The code is compared by the server, so a wrong one never reaches TypeScript. Whitespace is
        stripped before the comparison, which is what lets a controller submit the spaced form the
        player displays. A daemon with no code provisioned refuses every attempt.

        The body may carry a media server for the player to use. That is a Jellyfin token the
        controller mints for this player, not the user's own session token, so a compromised
        speaker costs one revocable credential.

        Bodies are capped at 4 KiB and must declare a `Content-Length`.

        Failed attempts are throttled per caller address. Three refusals earn a `429` carrying
        `Retry-After: 1`. A throttled attempt records nothing, so hammering does not extend the
        block: wait it out and the next wrong code is a `401` again, with the one after it held for
        2 seconds, then 4. A successful pair clears the failures behind it.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        description: |
          The pairing code, who is pairing, and optionally the media server credential the player
          should use on its own behalf.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairRequest'
            examples:
              minimal:
                summary: Pair without provisioning a media server.
                value:
                  code: '19524002'
                  controllerId: phone-1
                  controllerName: pixel 8
              provisioned:
                summary: Pair and hand the player its own Jellyfin credential.
                value:
                  code: '19524002'
                  controllerId: phone-1
                  controllerName: pixel 9
                  mediaServer:
                    accessToken: 3d9f0c1b7a5e4826
                    baseUrl: http://jellyfin.local:8096
                    deviceId: atolla-kitchen
                    userId: 8b1f2c3d4e5f6071
      responses:
        '200':
          description: Paired. The token authenticates every later request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairAccepted'
              example:
                token: 7c1e5a9b3d8f204617ca0be9352d8f7461a0c3d95e28b7f4016cad3928bf5e7d
        '400':
          $ref: '#/components/responses/PairBadRequest'
        '401':
          $ref: '#/components/responses/InvalidPairingCode'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/HandlerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/HandlerTimeout'

  /command:
    post:
      operationId: sendCommand
      tags: [control]
      summary: Act on the player's queue or playback.
      description: |
        Thirteen commands share one route, discriminated on `command`. The name and the shape of
        its members are the wire contract, so `command.zig` refuses an unknown name or a malformed
        member before the request crosses the bridge. The `tracks` array is the exception and
        passes through as opaque bytes: `Track` is a TypeScript interface with one source of truth,
        so a second definition in Zig would start refusing valid queues the day a field was added,
        and TypeScript needs the parsed object regardless.

        A `202` says the command was accepted, not that it has happened. The leader applies it to
        the queue it owns and answers with the state version that reflects it. What the speakers
        then do is visible only through `GET /state`: a member can miss the readiness barrier, and
        a `previous` can restart the current track instead of stepping back. A controller that
        reads this response as the outcome will show something the players are not doing.

        Commands naming a queue position may also carry the `trackId` expected there. A controller
        acts on a mirror that can be a long poll behind, and with several controllers paired the
        queue moves under it, so an index on its own can point at a track the user never chose.
        When the id does not match, the player drops the command.

        `setVolume` and `setMembers` appear in the design but are not accepted yet: both are group
        state rather than queue state and arrive with the group coordinator. Until then they are
        refused as `malformed_body`, like any other unknown name.

        Bodies are capped at 1 MiB and must declare a `Content-Length`.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        description: One command, named by its `command` member.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
            examples:
              pause:
                summary: Stop playing, keeping the position.
                value:
                  command: pause
              seek:
                summary: Move to 91.234 seconds into the current track.
                value:
                  command: seek
                  positionMs: 91234
              setQueue:
                summary: Replace the queue with an album and start at its third track.
                value:
                  album:
                    artistId: 1c4e7a09
                    artistName: Aphex Twin
                    id: 6f2b8c4d1e9a3705
                    name: Selected Ambient Works
                  command: setQueue
                  trackIndex: 2
                  tracks:
                    - duration: 293.4
                      id: 1a2b3c4d5e6f7081
                      name: Xtal
                    - duration: 568.1
                      id: 2b3c4d5e6f708192
                      name: Tha
                    - duration: 231.7
                      id: 3c4d5e6f708192a3
                      name: Pulsewidth
              removeAt:
                summary: Drop the fourth track, but only if it is still the one seen.
                value:
                  command: removeAt
                  trackId: 3c4d5e6f708192a3
                  trackIndex: 3
      responses:
        '202':
          description: |
            Accepted and applied to the queue. The body names the state version that reflects it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
              example:
                version: 412
        '400':
          $ref: '#/components/responses/CommandBadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '500':
          $ref: '#/components/responses/HandlerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/HandlerTimeout'

  /state:
    get:
      operationId: getState
      tags: [control]
      summary: The player's queue, playback and group state.
      description: |
        Everything a controller mirrors, in one snapshot. A controller holds the last one it was
        given and replaces it wholesale; there are no partial updates, because a snapshot small
        enough to send whole is simpler than a diff both ends have to agree on.

        The route is a long poll. Passing `since` asks for the first snapshot newer than that
        version, and the daemon holds the request open for up to 25 seconds waiting for one, though
        a change wakes it immediately. Twenty-five seconds passing with nothing new is not an
        error: it answers `304` with no body, because the controller already holds that snapshot
        and re-sending a queue of several hundred tracks every 25 seconds would be the only thing
        the wire carried. Omitting `since` answers the current snapshot straight away, which is how
        a controller gets its first one.

        The loop a controller runs is to read a snapshot, apply it, then ask again with the
        `version` it applied. A `304` means ask again unchanged, and a `200` means replace the
        mirror. Position is the one part that does not need a new snapshot, which is what
        `positionAtMs` is for.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: since
          in: query
          required: false
          description: |
            The version the controller already holds, which is normally the one it last
            applied. The daemon answers when it has something newer, or `304` when 25 seconds pass
            without that happening. A version higher than the current one is answered immediately
            instead, which is what stops a controller that outlived a restart from blocking forever
            against a counter that began again; see `StateVersion`.
          schema:
            $ref: '#/components/schemas/StateVersion'
      responses:
        '200':
          description: A snapshot newer than `since`, or the current one when `since` was omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateSnapshot'
              example:
                group: default
                leader: 4f3c9a1de8b27065
                members:
                  - enabled: true
                    id: 4f3c9a1de8b27065
                    name: Kitchen
                    state: playing
                    tier: tight
                playback:
                  isPlaying: true
                  loopMode: none
                  positionAtMs: 1758000000000
                  positionMs: 91234
                queue:
                  album:
                    artistId: 1c4e7a09
                    artistName: Aphex Twin
                    id: 6f2b8c4d1e9a3705
                    name: Selected Ambient Works
                  trackIndex: 1
                  tracks:
                    - duration: 293.4
                      id: 1a2b3c4d5e6f7081
                      name: Xtal
                    - duration: 568.1
                      id: 2b3c4d5e6f708192
                      name: Tha
                version: 412
        '304':
          description: |
            Twenty-five seconds passed with nothing newer than `since`. No body: the snapshot the
            controller holds is still the current one.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
        '500':
          $ref: '#/components/responses/HandlerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/HandlerTimeout'

components:
  securitySchemes:
    controllerToken:
      type: http
      scheme: bearer
      description: |
        The token `POST /pair` returned, sent as `Authorization: Bearer <token>`. It is checked by
        the server against `secrets/controllers`, so an unknown one never reaches TypeScript.

        A token identifies a controller rather than a user. Pairing again under a `controllerId`
        the player already knows replaces that record, killing the token it held, and a player
        keeps at most 32 controllers: pairing a 33rd evicts the one paired longest ago.

  parameters:
    ApiVersion:
      name: Atolla-API-Version
      in: header
      required: false
      description: |
        The version of this contract the caller speaks. Absent means 1, so a bare `curl` works and
        it agrees with the beacon's `"v": 1`. Surrounding whitespace is tolerated. Anything else,
        including a non-integer, is refused with `unsupported_api_version`, whose `supported`
        member reports what the daemon does speak. `GET /hello` is the documented exception and
        answers any version.
      schema:
        $ref: '#/components/schemas/ApiVersion'
        default: 1

  headers:
    RetryAfter:
      description: Seconds to wait before trying again, repeating the body's `retryAfterSeconds`.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 60
        description: The throttle doubles from 1 second and the limiter caps it at 60.
        examples: [1]

  schemas:
    ApiVersion:
      type: integer
      format: int32
      const: 1
      minimum: 1
      maximum: 1
      description: |
        A version of this contract. There is one, and this is the single place that changes when a
        second one lands.
      examples: [1]

    Problem:
      type: object
      description: |
        RFC 9457 problem details, served as `application/problem+json`. `type` is omitted rather
        than written as `about:blank`, which the RFC says is what an absent `type` means, so it
        stays free for a documentation URL later. Extension members are flat alongside the standard
        ones and are dropped when a given problem does not carry them.

        `code` is the stable vocabulary a client switches on. `title` is prose and may be reworded.
      required: [code, status, title]
      additionalProperties: false
      examples:
        - code: not_found
          status: 404
          title: not found
      properties:
        code:
          type: string
          description: |
            The machine-readable name of this refusal, and the whole vocabulary the daemon can
            answer with. `internal` is what a handler that threw answers, and doubles as the
            fallback body when a problem will not fit its render buffer.
          enum:
            - body_too_large
            - busy
            - expectation_failed
            - handler_timeout
            - headers_too_large
            - incomplete_body
            - internal
            - invalid_pairing_code
            - invalid_token
            - length_required
            - malformed_body
            - method_not_allowed
            - not_found
            - not_implemented
            - too_many_attempts
            - unavailable
            - unsupported_api_version
          examples: [invalid_pairing_code]
        detail:
          type: string
          maxLength: 128
          pattern: '^[ -~]+$'
          description: |
            Rarely sent. Naming the field that failed tells an unauthenticated caller which field
            to fix, and `/pair` is the one body a stranger on the LAN can post. Printable ASCII,
            and short: the whole rendered problem has to fit a 256-byte buffer or the daemon falls
            back to `internal`.
          examples: ['try later']
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          description: |
            How long to wait before trying again, repeated in the `Retry-After` header. The
            throttle doubles from 1 second and the limiter caps it at 60.
          examples: [1]
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: The HTTP status this body accompanies.
          examples: [400]
        supported:
          type: array
          items:
            $ref: '#/components/schemas/ApiVersion'
          description: The API versions the daemon speaks. Sent with `unsupported_api_version`.
          examples:
            - [1]
        title:
          type: string
          maxLength: 64
          pattern: '^[a-z ]+$'
          description: |
            A short human-readable summary of the refusal. Every one the daemon carries is
            lowercase words, and it is prose: switch on `code`, not on this.
          examples: ['not found']

    Hello:
      type: object
      description: A player's identity, constant for the life of the process.
      required: [apiVersions, id, name, tier, v, version]
      additionalProperties: false
      properties:
        apiVersions:
          type: array
          items:
            $ref: '#/components/schemas/ApiVersion'
          minItems: 1
          description: Every version of this contract the daemon speaks.
          examples:
            - [1]
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: The player's stable identifier, minted once and kept in its data directory.
          examples: [4f3c9a1de8b27065]
        name:
          type: string
          maxLength: 256
          pattern: '^[^\r\n]*$'
          description: |
            The display name from the player's config, empty if none was set. The whole `/hello`
            body has to fit a 1 KiB buffer, so a very long name stops the route answering at all.
          examples: [Kitchen]
        tier:
          type: string
          enum: [loose, tight]
          description: |
            How tightly this player can synchronise. A daemon is `tight`; a phone joining a group
            is `loose`.
          examples: [tight]
        v:
          $ref: '#/components/schemas/ApiVersion'
          description: |
            The current API version, duplicating `apiVersions`' last entry. Short because the
            beacon repeats it in every datagram, where there is no header to carry it.
          examples: [1]
        version:
          type: string
          pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$'
          description: The atolla build the daemon is running.
          examples: ['0.0.0']

    MediaServer:
      type: object
      description: A media server credential for the player to use on its own behalf.
      required: [accessToken, baseUrl, deviceId, userId]
      additionalProperties: true
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[ -~]+$'
          description: A token minted for this player, revocable without touching the user's login.
          examples: [3d9f0c1b7a5e4826]
        baseUrl:
          type: string
          minLength: 1
          maxLength: 512
          format: uri
          description: Where the media server answers.
          examples: ['http://jellyfin.local:8096']
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          description: The device the token was minted against.
          examples: [atolla-kitchen]
        userId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          description: The media server account the token belongs to.
          examples: [8b1f2c3d4e5f6071]

    PairRequest:
      type: object
      description: |
        Every length cap here is enforced by `pair.zig` before the request crosses the bridge, and
        an unknown member is ignored so a v1 daemon does not refuse a body a later controller added
        a field to.
      required: [code, controllerId, controllerName]
      additionalProperties: true
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^\d{8}$'
          description: |
            The player's pairing code. The daemon strips whitespace before comparing, so the
            spaced form the player displays is accepted too, and it enforces only a 32-byte cap
            here: a code of the wrong shape is a `401` rather than a `400`, so the caller learns
            nothing about it.
          examples: ['19524002']
        controllerId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          description: |
            Stable per controller. Pairing again under an id the player already knows replaces that
            record, so the old token dies.
          examples: [phone-1]
        controllerName:
          type: string
          maxLength: 128
          pattern: '^[^\r\n]*$'
          description: |
            Shown to the user when they review what is paired. May be empty, but must be present:
            a body omitting it is refused.
          examples: ['pixel 8']
        mediaServer:
          $ref: '#/components/schemas/MediaServer'

    PairAccepted:
      type: object
      description: The credential the controller sends on every later request.
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            256 bits of entropy, hex encoded. Nothing types this, so it shares no shape with the
            pairing code.
          examples:
            - 7c1e5a9b3d8f204617ca0be9352d8f7461a0c3d95e28b7f4016cad3928bf5e7d

    StateVersion:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
      description: |
        A monotonic counter the leader bumps whenever the state a controller mirrors changes. Its
        only job is to order changes. It does not count commands: one command can settle several
        fields, and some changes have no command behind them at all.

        Nothing persists it, so it starts again at 1 when the daemon restarts. Persisting would
        mean a disk write on every bump, which is every command, to protect against something a
        rule handles for nothing: a `since` higher than the current version names something the
        daemon will never reach, so it is answered immediately with the current snapshot rather
        than held for 25 seconds. A controller that outlived a restart gets one snapshot it may
        already have held, adopts the version in it, and carries on. A `since` equal to the current
        version is the ordinary case and does block, which is what a poll is for. Versions are
        ordered within a run of the daemon, and comparing them across runs means nothing.

        The 32-bit ceiling takes a bump a second for 68 years to reach, and it keeps the value
        exact in every JSON parser. An `int64` would not, for a client reading it as a JavaScript
        number.
      examples: [412]

    TrackIndex:
      type: integer
      format: int32
      minimum: 0
      maximum: 100000
      description: |
        A position in the queue, counted from zero. The server holds no queue of its own, so the
        bound is only a sanity check, and it sits well above what the 1 MiB body cap lets a
        `setQueue` deliver. Whether the index falls inside the queue the player currently has is
        settled after the request crosses the bridge.
      examples: [3]

    Tracks:
      type: array
      maxItems: 10000
      description: |
        The queue a command carries. The server hands this array across the bridge without parsing
        it, so it enforces neither the member shape nor `maxItems`: the 1 MiB body cap is what
        refuses an oversized queue, and it is reached first anyway. What checks the shape is the
        handler on the other side, which refuses the body as `malformed_body` if a member is not a
        track.
      items:
        $ref: '#/components/schemas/Track'
      examples:
        - - duration: 293.4
            id: 1a2b3c4d5e6f7081
            name: Xtal

    CommandBare:
      type: object
      description: The commands that carry no members beyond their own name.
      required: [command]
      additionalProperties: true
      properties:
        command:
          type: string
          enum: [next, pause, play, previous, shuffle]
          description: |
            `play` and `pause` act on the current track, `next` and `previous` move between
            tracks, and `shuffle` reorders what has not played yet.

            `previous` follows the button rather than the word: the leader restarts the current
            track when it is more than three seconds in, and steps back otherwise. That is what
            the same button already does when the phone is playing.
          examples: [pause]

    CommandSeek:
      type: object
      description: Move within the current track.
      required: [command, positionMs]
      additionalProperties: true
      properties:
        command:
          type: string
          const: seek
        positionMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400000
          description: |
            Where to move to, measured from the start of the track. Milliseconds, matching
            `/state`'s `positionMs`, though the player's own clock works in seconds and rounds.
            The bound is a day, which no track reaches. Whether the position falls inside the
            track being played is settled after the request crosses the bridge.
          examples: [91234]

    CommandJumpToIndex:
      type: object
      description: Play a track already in the queue.
      required: [command, trackIndex]
      additionalProperties: true
      properties:
        command:
          type: string
          const: jumpToIndex
        trackId:
          $ref: '#/components/schemas/CommandTrackId'
        trackIndex:
          $ref: '#/components/schemas/TrackIndex'

    CommandSetQueue:
      type: object
      description: |
        Replace the queue outright and start playing. This is the largest body the API takes, and
        the reason `/command`'s cap is 1 MiB rather than the 4 KiB the other routes get.
      required: [command, tracks]
      additionalProperties: true
      properties:
        album:
          $ref: '#/components/schemas/Album'
          description: |
            The album the queue came from, when it came from one. A queue with no album behind it,
            such as a shuffle across an artist, omits it. The server passes it through unparsed, as
            it does `tracks`.

            An album that arrives malformed is dropped rather than refusing the command, which is
            the one place this route is lenient: the tracks are what the user asked to hear, and
            the album is the context they are shown in. A malformed `tracks` refuses.
        command:
          type: string
          const: setQueue
        trackIndex:
          $ref: '#/components/schemas/TrackIndex'
        tracks:
          $ref: '#/components/schemas/Tracks'

    CommandAddToQueue:
      type: object
      description: Append tracks to the end of the queue.
      required: [command, tracks]
      additionalProperties: true
      properties:
        command:
          type: string
          const: addToQueue
        tracks:
          $ref: '#/components/schemas/Tracks'

    CommandPlayNext:
      type: object
      description: Insert tracks directly after the current one, ahead of the rest of the queue.
      required: [command, tracks]
      additionalProperties: true
      properties:
        command:
          type: string
          const: playNext
        tracks:
          $ref: '#/components/schemas/Tracks'

    CommandRemoveAt:
      type: object
      description: Drop one track from the queue.
      required: [command, trackIndex]
      additionalProperties: true
      properties:
        command:
          type: string
          const: removeAt
        trackId:
          $ref: '#/components/schemas/CommandTrackId'
        trackIndex:
          $ref: '#/components/schemas/TrackIndex'

    CommandMove:
      type: object
      description: Reorder the queue by moving one track.
      required: [command, fromIndex, toIndex]
      additionalProperties: true
      properties:
        command:
          type: string
          const: move
        fromIndex:
          $ref: '#/components/schemas/TrackIndex'
        toIndex:
          $ref: '#/components/schemas/TrackIndex'
        trackId:
          $ref: '#/components/schemas/CommandTrackId'

    CommandSetLoopMode:
      type: object
      description: |
        Choose how the queue repeats. The controller sends the mode it wants rather than asking the
        player to cycle to the next one, because a mirror that is a long poll behind would cycle
        from a mode the player has already left. Naming the mode gives the same result whatever the
        player currently has.
      required: [command, loopMode]
      additionalProperties: true
      properties:
        command:
          type: string
          const: setLoopMode
        loopMode:
          type: string
          enum: [none, queue, track]
          description: |
            `none` stops at the end of the queue, `queue` starts it again, `track` repeats the
            current one.
          examples: [queue]

    CommandTrackId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[ -~]+$'
      description: |
        The track the controller expects to find at the position it named. Optional, and worth
        sending: the player drops the command when the id does not match, so a stale mirror cannot
        reorder or delete the wrong track. A command that omits it is applied to whatever sits at
        that position.
      examples: [3c4d5e6f708192a3]

    Command:
      description: |
        One command for the player. `command` names it and the rest of the members belong to that
        name: an unknown name is `malformed_body`, as is a missing or wrongly typed member of a
        name the player does know.

        A member belonging to no command is ignored rather than refused, as in `PairRequest`, so a
        v1 daemon keeps accepting a body that a later controller added a field to. That is why each
        variant is open rather than sealed.
      oneOf:
        - $ref: '#/components/schemas/CommandBare'
        - $ref: '#/components/schemas/CommandSeek'
        - $ref: '#/components/schemas/CommandJumpToIndex'
        - $ref: '#/components/schemas/CommandSetQueue'
        - $ref: '#/components/schemas/CommandAddToQueue'
        - $ref: '#/components/schemas/CommandPlayNext'
        - $ref: '#/components/schemas/CommandRemoveAt'
        - $ref: '#/components/schemas/CommandMove'
        - $ref: '#/components/schemas/CommandSetLoopMode'
      discriminator:
        propertyName: command
        mapping:
          addToQueue: '#/components/schemas/CommandAddToQueue'
          jumpToIndex: '#/components/schemas/CommandJumpToIndex'
          move: '#/components/schemas/CommandMove'
          next: '#/components/schemas/CommandBare'
          pause: '#/components/schemas/CommandBare'
          play: '#/components/schemas/CommandBare'
          playNext: '#/components/schemas/CommandPlayNext'
          previous: '#/components/schemas/CommandBare'
          removeAt: '#/components/schemas/CommandRemoveAt'
          seek: '#/components/schemas/CommandSeek'
          setLoopMode: '#/components/schemas/CommandSetLoopMode'
          setQueue: '#/components/schemas/CommandSetQueue'
          shuffle: '#/components/schemas/CommandBare'

    CommandAccepted:
      type: object
      description: |
        The version the command produced. `GET /state?since=` with anything lower returns that
        snapshot without blocking, so a controller can read the result of its own command without
        waiting for the next change. It says nothing about what the speakers are doing.
      required: [version]
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'

    Track:
      type: object
      description: |
        A track, as much of one as a controller needs. `atolla_core/src/models/Track.ts` is the one
        source of truth and holds a good deal more: release dates, sort names, genres, disc and
        track numbers. The daemon relays all of it untouched, and this schema describes none of it,
        because nothing reading a snapshot depends on it. Listing those members here would make a
        second definition to keep in step with the first, and the spec is the copy that would be
        wrong once they drifted.

        What is described is the members the interface requires, plus the ones a controller renders
        and navigates from. Anything else the media server supplied arrives alongside them.
      required: [duration, id, name]
      additionalProperties: true
      properties:
        albumId:
          type: string
          maxLength: 64
          pattern: '^[ -~]+$'
          description: So a controller can offer to open the album this came from.
          examples: [6f2b8c4d1e9a3705]
        albumImageUrl:
          type: string
          maxLength: 2048
          format: uri
          description: |
            The artwork. A controller has no way to work this out, so it travels with the track.
          examples: ['http://jellyfin.local:8096/Items/6f2b8c4d/Images/Primary']
        albumName:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Selected Ambient Works]
        artistId:
          type: string
          maxLength: 64
          pattern: '^[ -~]+$'
          examples: [1c4e7a09]
        artistName:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Aphex Twin]
        duration:
          type: number
          format: double
          minimum: 0
          maximum: 86400
          description: |
            Seconds, not milliseconds, because that is what the store and the audio engine work in.
            The playback position beside it is milliseconds: a position needs finer resolution than
            a length, and the asymmetry is deliberate.
          examples: [293.4]
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          description: |
            The media server's identifier. A command naming a queue position may carry it as a
            guard, and the native player matches the track it is playing by it.
          examples: [1a2b3c4d5e6f7081]
        name:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Xtal]

    Album:
      type: object
      description: |
        The album a queue came from, so a controller can say what is playing without looking it up.
        As with `Track`, this is what a controller depends on rather than everything
        `atolla_core/src/models/Album.ts` holds.
      required: [artistId, artistName, id, name]
      additionalProperties: true
      properties:
        artistId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          examples: [1c4e7a09]
        artistName:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Aphex Twin]
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          examples: [6f2b8c4d1e9a3705]
        imageUrl:
          type: string
          maxLength: 2048
          format: uri
          examples: ['http://jellyfin.local:8096/Items/6f2b8c4d/Images/Primary']
        name:
          type: string
          maxLength: 512
          pattern: '^[^\r\n]*$'
          examples: [Selected Ambient Works]

    PlayerState:
      type: string
      enum: [idle, paused, playing]
      description: |
        What a player is doing. `idle` is a player with nothing queued, which is not the same as one
        holding a queue it has paused.
      examples: [playing]

    Member:
      type: object
      description: |
        A player in the group. Today a daemon is a group of one and reports only itself, so this
        array has a single entry; discovery fills it out at the step that builds the beacon.
      required: [enabled, id, name, state, tier]
      additionalProperties: true
      properties:
        enabled:
          type: boolean
          description: |
            Whether this member plays. The enabled set is what defines the group, so a player that
            is present but not enabled is one the user switched off rather than one that failed.
          examples: [true]
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: The stable player id, the same one `GET /hello` reports.
          examples: [4f3c9a1de8b27065]
        lastError:
          type: string
          maxLength: 256
          pattern: '^[^\r\n]*$'
          description: |
            Why this member is not playing when it should be, absent when nothing is wrong. A
            member that misses a track keeps its place in the group and rejoins at the next one, so
            this is what a controller shows instead of removing it from the list.
          examples: ['could not reach the media server']
        name:
          type: string
          maxLength: 256
          pattern: '^[^\r\n]*$'
          examples: [Kitchen]
        state:
          $ref: '#/components/schemas/PlayerState'
        tier:
          type: string
          enum: [loose, tight]
          description: How tightly this member can synchronise, as `GET /hello` reports it.
          examples: [tight]

    StateSnapshot:
      type: object
      description: |
        Everything a controller mirrors, replaced whole on each read. A controller applies it and
        then asks again with the `version` it applied.
      required: [group, leader, members, playback, queue, version]
      additionalProperties: true
      properties:
        group:
          type: string
          maxLength: 64
          pattern: '^[^\r\n]*$'
          description: |
            Which group this snapshot describes. There is one, called `default`, and it is on the
            wire from the start so that zones are an addition later rather than a redesign.
          examples: [default]
        leader:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: |
            The player that owns the queue and schedules playback. A daemon on its own leads,
            so this is its own id until a group has more than one member in it.
          examples: [4f3c9a1de8b27065]
        members:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Member'
          examples:
            - - enabled: true
                id: 4f3c9a1de8b27065
                name: Kitchen
                state: playing
                tier: tight
        playback:
          type: object
          required: [isPlaying, loopMode, positionAtMs, positionMs]
          additionalProperties: true
          properties:
            isPlaying:
              type: boolean
              examples: [true]
            loopMode:
              type: string
              enum: [none, queue, track]
              examples: [none]
            positionAtMs:
              type: integer
              format: int64
              minimum: 0
              maximum: 99999999999999
              description: |
                The leader's wall clock when it read `positionMs`, in epoch milliseconds. The two
                clocks are not synchronised, so what this is good for is elapsed time rather than
                the absolute value: a controller takes the difference against its own clock as the
                snapshot arrives, keeps it, and extrapolates from there. Reading it as a time its
                own clock agrees with puts the progress bar out by however far the two have
                drifted.
              examples: [1758000000000]
            positionMs:
              type: integer
              format: int64
              minimum: 0
              maximum: 86400000
              description: |
                How far into the current track the leader was at `positionAtMs`. The pair lets a
                controller run a smooth progress bar between snapshots instead of asking for the
                position over and over. Position is the only part of the state that changes
                continuously, so without the pair the long poll would have nothing useful to say
                about it.
              examples: [91234]
        queue:
          type: object
          required: [trackIndex, tracks]
          additionalProperties: true
          properties:
            album:
              $ref: '#/components/schemas/Album'
            trackIndex:
              $ref: '#/components/schemas/TrackIndex'
            tracks:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/Track'
        version:
          $ref: '#/components/schemas/StateVersion'

  examples:
    incompleteBody:
      description: The body stopped short of its declared length.
      value:
        code: incomplete_body
        status: 400
        title: incomplete body
    malformedBody:
      description: The body is not the shape this route accepts.
      value:
        code: malformed_body
        status: 400
        title: malformed body
    unsupportedApiVersion:
      description: The version header named something the daemon does not speak.
      value:
        code: unsupported_api_version
        status: 400
        supported: [1]
        title: unsupported api version
    invalidPairingCode:
      description: The code did not match, or the daemon has none provisioned.
      value:
        code: invalid_pairing_code
        status: 401
        title: invalid pairing code
    invalidToken:
      description: The `Authorization` header was missing, malformed, or named an unknown token.
      value:
        code: invalid_token
        status: 401
        title: invalid token
    notFound:
      description: No route serves this path.
      value:
        code: not_found
        status: 404
        title: not found
    methodNotAllowed:
      description: A route serves this path, but not by this method.
      value:
        code: method_not_allowed
        status: 405
        title: method not allowed
    lengthRequired:
      description: The request was chunked, so its length was not known up front.
      value:
        code: length_required
        status: 411
        title: length required
    bodyTooLarge:
      description: The declared length exceeds the route's cap, so no byte of it was read.
      value:
        code: body_too_large
        status: 413
        title: body too large
    expectationFailed:
      description: The request carried an `Expect` the daemon cannot meet.
      value:
        code: expectation_failed
        status: 417
        title: expectation failed
    tooManyAttempts:
      description: This caller has spent its pairing attempts.
      value:
        code: too_many_attempts
        retryAfterSeconds: 1
        status: 429
        title: too many attempts
    headersTooLarge:
      description: The request head did not fit the daemon's buffer.
      value:
        code: headers_too_large
        status: 431
        title: headers too large
    unavailable:
      description: Nothing was attached to answer, or every bridge slot was in use.
      value:
        code: unavailable
        status: 503
        title: unavailable
    busy:
      description: The connection cap was reached, so the request was refused unread.
      value:
        code: busy
        retryAfterSeconds: 1
        status: 503
        title: busy
    handlerTimeout:
      description: The handler did not answer within 28 seconds.
      value:
        code: handler_timeout
        status: 504
        title: handler timeout
    notImplemented:
      description: The route is in the table but nothing serves it yet.
      value:
        code: not_implemented
        status: 501
        title: not implemented
    internalError:
      description: The handler threw.
      value:
        code: internal
        status: 500
        title: internal error

  responses:
    BadRequest:
      description: |
        Refused before the route could act. `incomplete_body` means the connection went quiet
        mid-body; `unsupported_api_version` means the version header named something else.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            incompleteBody:
              $ref: '#/components/examples/incompleteBody'
            unsupportedApiVersion:
              $ref: '#/components/examples/unsupportedApiVersion'

    PairBadRequest:
      description: |
        As `BadRequest`, plus `malformed_body` for a body that is not JSON, is missing a member, or
        carries one past its cap. The pairing code is not consulted, and the attempt counts against
        this caller's address only.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            incompleteBody:
              $ref: '#/components/examples/incompleteBody'
            malformedBody:
              $ref: '#/components/examples/malformedBody'
            unsupportedApiVersion:
              $ref: '#/components/examples/unsupportedApiVersion'

    CommandBadRequest:
      description: |
        As `BadRequest`, plus `malformed_body` for a body that is not JSON, does not name a command
        this player accepts, or omits a member the named command requires. A member belonging to no
        command is ignored rather than refused.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            incompleteBody:
              $ref: '#/components/examples/incompleteBody'
            malformedBody:
              $ref: '#/components/examples/malformedBody'
            unsupportedApiVersion:
              $ref: '#/components/examples/unsupportedApiVersion'

    InvalidPairingCode:
      description: |
        The submitted code is not the provisioned one, or nothing is provisioned. The two are
        deliberately indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidPairingCode:
              $ref: '#/components/examples/invalidPairingCode'

    InvalidToken:
      description: |
        The request carried no usable `Authorization: Bearer` token. A missing header, a malformed
        one and an unknown token all get this same answer, so a caller learns nothing about which
        tokens exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidToken:
              $ref: '#/components/examples/invalidToken'

    NotFound:
      description: No route serves the requested path. Answered before an operation is selected.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              $ref: '#/components/examples/notFound'

    MethodNotAllowed:
      description: |
        A route serves the path, but not by the method used. Answered before an operation is
        selected.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            methodNotAllowed:
              $ref: '#/components/examples/methodNotAllowed'

    LengthRequired:
      description: |
        The request used chunked transfer encoding. The daemon refuses a body whose size it cannot
        know before reading it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            lengthRequired:
              $ref: '#/components/examples/lengthRequired'

    BodyTooLarge:
      description: |
        The declared `Content-Length` is over the cap, so the body was never read. The cap is 1 MiB
        for any request and tighter per route: 4 KiB for `/pair` and `/state`. `/command` takes the
        full 1 MiB, because a `setQueue` carries the whole queue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            bodyTooLarge:
              $ref: '#/components/examples/bodyTooLarge'

    ExpectationFailed:
      description: |
        The request carried an `Expect` other than `100-continue`. `100-continue` itself is
        honoured, and answered before a rejection that would otherwise invite the upload it exists
        to prevent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            expectationFailed:
              $ref: '#/components/examples/expectationFailed'

    TooManyAttempts:
      description: This caller must wait before pairing again.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooManyAttempts:
              $ref: '#/components/examples/tooManyAttempts'

    HeadersTooLarge:
      description: |
        The request head exceeded 8 KiB, so it was never parsed. Answered before an operation is
        selected, with the status line framed by hand.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            headersTooLarge:
              $ref: '#/components/examples/headersTooLarge'

    Unavailable:
      description: |
        The request could not be handed to TypeScript: nothing is attached to answer, or every
        bridge slot was in use.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              $ref: '#/components/examples/unavailable'

    Busy:
      description: |
        The daemon is already serving its maximum of 32 connections, so this one was refused
        without a request being read.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            busy:
              $ref: '#/components/examples/busy'

    HandlerTimeout:
      description: The handler was given the request but did not answer within 28 seconds.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            handlerTimeout:
              $ref: '#/components/examples/handlerTimeout'

    NotImplemented:
      description: The route is in the router's table but no handler serves it yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notImplemented:
              $ref: '#/components/examples/notImplemented'

    HandlerFailed:
      description: |
        The handler threw. The daemon's log holds what went wrong; the problem says only that
        something did, since a caller on the LAN has no business knowing more.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              $ref: '#/components/examples/internalError'
